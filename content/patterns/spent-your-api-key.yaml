rule: |
  ## Paid calls wait for a yes
  - Never call a paid API or use a key from .env unless the user says so in this turn.
  - First state the route and the estimated cost, and wait for yes. A trial that already showed a cost is not a yes
    for the rest. Do not start that run in the background.
  - Stop when the user says stop.
  - Use a separate, spend-capped key for agent sessions. Do not load the project's ANTHROPIC_API_KEY.
  - Deny reading .env files. In `.claude/settings.json`, deny `Read(./.env)` and `Read(**/.env*)`.
  - A Read deny does not cover a shell that prints the file. Do not `cat`, `type`, or `Get-Content` a .env, and do not
    paste a token into the chat.
extras:
  - kind: settings
    title:
      en: 'Claude Code: deny reading and editing .env files'
      zh: Claude Code：拒绝读取和修改 .env
      pt: 'Claude Code: negar leitura e edição de arquivos .env'
      ko: 'Claude Code: .env 읽기와 수정을 거부'
      vi: 'Claude Code: chặn đọc và sửa file .env'
      de: 'Claude Code: Lesen und Bearbeiten von .env-Dateien verweigern'
    file: .claude/settings.json
    lang: json
    note:
      en: >-
        Denies `Read(./.env)` and `Read(**/.env*)`, plus Edit on the same paths. A line in CLAUDE.md does not enforce
        this. A shell that prints the file is a separate hole, and the rule above covers it. Adjust the globs to the
        repo.
      zh: >-
        拒绝 `Read(./.env)` 和 `Read(**/.env*)`，同样的路径也拒绝 Edit。CLAUDE.md 里的一行不会强制执行。用 shell
        把文件打出来是另一条口子，上面的规则写了这一点。按仓库改这些 glob。
      pt: >-
        Nega `Read(./.env)` e `Read(**/.env*)`, e também Edit nos mesmos caminhos. Uma linha no CLAUDE.md não faz
        cumprir isso. Um shell que imprime o arquivo é outro buraco, e a regra acima cobre esse caso. Ajuste os globs
        ao repositório.
      ko: >-
        `Read(./.env)`와 `Read(**/.env*)`를 거부하고, 같은 경로의 Edit도 거부합니다. CLAUDE.md의 한 줄은 이것을 강제하지 않습니다. 파일을 출력하는 셸은
        별개의 구멍이고, 위 규칙이 그 경우를 적습니다. glob은 저장소에 맞게 바꾸세요.
      vi: >-
        Chặn `Read(./.env)` và `Read(**/.env*)`, cùng Edit trên các đường đó. Một dòng trong CLAUDE.md không cưỡng
        được việc này. Shell in nội dung file là một lỗ khác, và rule phía trên nói tới lỗ đó. Chỉnh glob cho đúng
        repo.
      de: >-
        Verweigert `Read(./.env)` und `Read(**/.env*)`, und Edit auf denselben Pfaden. Eine Zeile in CLAUDE.md erzwingt
        das nicht. Eine Shell, die die Datei ausgibt, ist ein anderes Loch, und die Regel oben nennt es. Die Globs an
        das Repo anpassen.
    code: |
      {
        "permissions": {
          "deny": [
            "Read(./.env)",
            "Read(**/.env*)",
            "Edit(./.env)",
            "Edit(**/.env*)"
          ]
        }
      }
