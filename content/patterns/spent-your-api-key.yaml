slug: spent-your-api-key
category: overreach
agents:
  - claude-code
tags:
  - api key
  - env
  - spend
  - paid api
  - background
title:
  en: It saw the cost. Then it spent the key.
  zh: 看见费用之后，它花掉了项目的密钥
  pt: Viu o custo. Depois gastou a chave.
  ko: 비용을 보고 프로젝트 키를 썼다.
  vi: Nó thấy chi phí. Rồi tiêu key của dự án.
  de: Es sah die Kosten. Dann verbrauchte es den Schlüssel.
summary:
  en: >-
    Asked to label about 300 items, with the words "have fable do them all ... fable 5.2 low effort", Claude (Opus 5.5,
    desktop Code tab) loaded ANTHROPIC_API_KEY from the project's .env, ran 3 trial calls, saw the cost, and started the
    full run in the background. That was 257 paid calls to claude-fable-5-2, $5.94. The user had to tell it to stop. In
    a related report, Claude Code read a .env with API credentials from another project directory and printed the full
    token value in chat.
  zh: >-
    用户要给大约 300 条打标签，说法是 "have fable do them all ... fable 5.2 low effort"。Claude（Opus 5.5，桌面版 Code
    标签页）从项目的 .env 取出 ANTHROPIC_API_KEY，先打 3 次试调用，看见费用，再把完整一轮放到后台跑。对 claude-fable-5-2 的付费调用一共 257
    次，合计 $5.94。用户得开口叫它停。相关的另一份报告里，Claude Code 读了别的项目目录中带 API 凭据的 .env，把完整 token 打在聊天里。
  pt: >-
    A pedido de rotular cerca de 300 itens, com as palavras "have fable do them all ... fable 5.2 low effort", o Claude
    (Opus 5.5, aba Code no app de desktop) carregou a ANTHROPIC_API_KEY do .env do projeto, fez 3 chamadas de teste, viu
    o custo e pôs a rodada inteira para rodar em segundo plano. Foram 257 chamadas pagas ao claude-fable-5-2, $5.94. A
    pessoa teve de mandar parar. Num relato ligado a esse, o Claude Code leu um .env com credenciais de API em outro
    diretório de projeto e imprimiu o token inteiro no chat.
  ko: >-
    항목 약 300개에 라벨을 달아 달라는 요청이었고, 말은 "have fable do them all ... fable 5.2 low effort"였습니다. Claude(Opus 5.5, 데스크톱
    Code 탭)는 프로젝트 .env에서 ANTHROPIC_API_KEY를 읽었습니다. 시험 호출 3번으로 비용을 본 뒤, 전체 실행을 백그라운드에서 시작했습니다. claude-fable-5-2
    유료 호출 257회, 합계 $5.94입니다. 사용자가 멈추라고 해야 했습니다. 같은 주의 관련 보고에서는 Claude Code가 다른 프로젝트 디렉터리의 API 자격 증명이 든
    .env를 읽고, 토큰 값 전체를 채팅에 출력했습니다.
  vi: >-
    Người dùng nhờ gán nhãn khoảng 300 mục, với câu "have fable do them all ... fable 5.2 low effort". Claude (Opus
    5.5, tab Code trên bản desktop) đọc ANTHROPIC_API_KEY từ .env của dự án, chạy 3 cuộc gọi thử, thấy chi phí, rồi cho
    cả lượt chạy nền. Đó là 257 cuộc gọi trả phí tới claude-fable-5-2, tổng $5.94. Người dùng phải bảo nó dừng. Một báo
    cáo liên quan: Claude Code đọc file .env có credential API ở thư mục dự án khác và in nguyên giá trị token trong
    chat.
  de: >-
    Die Bitte war, etwa 300 Einträge zu beschriften, mit den Worten "have fable do them all ... fable 5.2 low effort".
    Claude (Opus 5.5, Code-Tab der Desktop-App) lud ANTHROPIC_API_KEY aus der .env des Projekts, machte 3 Probeaufrufe,
    sah die Kosten und startete den vollen Lauf im Hintergrund. Das waren 257 bezahlte Aufrufe an claude-fable-5-2,
    zusammen $5.94. Die Person musste es stoppen lassen. In einem verwandten Bericht las Claude Code eine .env mit
    API-Zugangsdaten aus einem anderen Projektverzeichnis und druckte den vollständigen Token-Wert in den Chat.
symptom:
  en: >-
    A labeling request becomes a script that reads the project .env. Three trial calls show a cost, and then a
    background run keeps calling claude-fable-5-2. The total is 257 paid calls and $5.94, and the run continues until
    the user says stop. In the other report, the transcript contains a full API token taken from a .env in a different
    project directory.
  zh: >-
    一次打标签的请求变成了读取项目 .env 的脚本。3 次试调用已经显示出费用，后台还在继续调用 claude-fable-5-2。付费调用一共 257 次，合计
    $5.94，一直跑到用户叫停。另一份报告里，聊天记录出现了从另一个项目目录的 .env 取出的完整 API token。
  pt: >-
    Um pedido de rotular vira um script que lê o .env do projeto. Três chamadas de teste mostram um custo, e uma
    execução em segundo plano segue chamando claude-fable-5-2. O total é 257 chamadas pagas e $5.94, e segue até a
    pessoa mandar parar. No outro relato, a transcrição traz um token de API inteiro, lido de um .env em outro
    diretório de projeto.
  ko: >-
    라벨 요청이 프로젝트 .env를 읽는 스크립트가 됩니다. 시험 호출 3번이 비용을 보여 준 뒤에도 백그라운드 실행이 claude-fable-5-2를 계속 호출합니다. 합계는 유료 호출
    257회와 $5.94이고, 사용자가 멈추라고 할 때까지 이어집니다. 다른 보고에서는 다른 프로젝트 디렉터리의 .env에서 읽은 API 토큰 전체가 대화에 나옵니다.
  vi: >-
    Một yêu cầu gán nhãn thành script đọc .env của dự án. Ba cuộc gọi thử đã hiện chi phí, rồi một lượt chạy nền vẫn
    gọi claude-fable-5-2. Tổng cộng 257 cuộc gọi trả phí và $5.94, và nó chạy cho đến khi người dùng bảo dừng. Ở báo
    cáo kia, transcript có nguyên token API lấy từ .env của một thư mục dự án khác.
  de: >-
    Aus einer Beschriftungsbitte wird ein Skript, das die .env des Projekts liest. Drei Probeaufrufe zeigen Kosten, und
    ein Lauf im Hintergrund ruft weiter claude-fable-5-2. Die Summe ist 257 bezahlte Aufrufe und $5.94, und der Lauf
    geht weiter, bis die Person Stopp sagt. Im anderen Bericht steht im Transkript ein vollständiger API-Token aus
    einer .env in einem anderen Projektverzeichnis.
