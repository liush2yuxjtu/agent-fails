slug: orphaned-new-file
category: wrong-feature
agents:
  - claude-code
  - cursor
  - codex
  - copilot
tags:
  - unwired
  - unused file
  - not registered
  - route not added
title:
  en: New module written, never wired in
  zh: 新模块写好了，却没接上
  pt: Módulo novo escrito, nunca ligado
  ko: 새 모듈을 썼지만 연결하지 않음
  vi: Module mới viết xong, không bao giờ nối vào
  de: Neues Modul geschrieben, nie verdrahtet
summary:
  en: >-
    The agent creates the file that implements the feature but never imports, registers or routes it, so the feature
    doesn't exist for users.
  zh: 智能体写了实现功能的文件，却没导入、没注册、没加路由，所以对用户来说这个功能并不存在。
  pt: O agente cria um arquivo/helper novo e esquece de importar, registrar ou chamar — o bug original permanece.
  ko: 에이전트가 새 파일/헬퍼를 만들고 import·등록·호출을 깜빡해 원래 버그가 남습니다.
  vi: Agent tạo file/helper mới rồi quên import, đăng ký hoặc gọi — bug gốc vẫn còn.
  de: >-
    Der Agent legt eine neue Datei/einen Helper an und vergisst Import, Registrierung oder Aufruf — der Originalbug
    bleibt.
symptom:
  en: >-
    A new file appears in the diff and looks complete. Nothing references it; the route, menu item, handler or job never
    runs.
  zh: diff 里多了一个看起来完整的新文件，但没有任何地方引用它；路由、菜单、处理函数或定时任务从没被执行。
  pt: Arquivo novo no PR; grep mostra zero referências; comportamento runtime igual.
  ko: PR에 새 파일이 있지만 grep 참조가 없고 런타임 동작이 같습니다.
  vi: File mới trong PR; grep không thấy reference; hành vi runtime như cũ.
  de: Neue Datei im PR; Grep zeigt null Referenzen; Runtime-Verhalten unverändert.
why:
  en: >-
    Wiring lives in other files (a router, an index, a DI container, a cron table) that the agent didn't open,
    especially in larger refactors. agent-review lists it as AR016 "Orphaned new file".
  zh: “接线”的代码在别的文件里（路由表、index、依赖注入容器、cron 表），智能体没打开它们，大型重构里尤其常见。agent-review 把它列为 AR016“孤立的新文件”。
  pt: >-
    Escrever o módulo parece progresso; wiring é o passo fácil de pular. Verify skills que exigem evidência de caminho
    ponta a ponta pegam.
  ko: 모듈을 쓰는 건 진전처럼 보이고 wiring은 건너뛰기 쉽습니다. 엔드투엔드 경로 증거를 요구하는 verify 스킬이 잡습니다.
  vi: Viết module trông như tiến độ; wiring dễ bị bỏ. Verify skill đòi bằng chứng đường end-to-end sẽ bắt.
  de: >-
    Das Modul zu schreiben wirkt wie Fortschritt; Verdrahten ist leicht zu überspringen. Verify-Skills, die
    End-to-End-Evidenz verlangen, fangen das.
example:
  caption:
    en: Illustrative.
    zh: 示意。
    pt: Ilustrativo.
    ko: 예시.
    vi: Minh họa.
    de: Illustrativ.
  lang: text
  code: |
    + src/routes/export.ts        (new: GET /export handler, 80 lines)
      src/routes/index.ts         (unchanged: export route never registered)
    $ curl -i localhost:3000/export   ->  404
rule: |
  ## New files must be reachable
  - For every new file, name the place that imports or registers it, and show that reference in the diff.
  - Prove the feature is reachable end to end: hit the route, run the command, or render the page,
    and paste the output.
  - Remove any new file that nothing uses.
extras:
  - ref: verify-skill
sources:
  - title: 'vnmoorthy/agent-review TAXONOMY: AR016 Orphaned new file'
    url: https://github.com/vnmoorthy/agent-review/blob/main/TAXONOMY.md#ar016-orphaned-new-file
