slug: hallucinated-package
category: bug
agents:
  - claude-code
  - cursor
  - codex
  - copilot
tags:
  - npm
  - pip
  - dependency
  - slopsquatting
  - import
  - supply chain
title:
  en: Imported a package that doesn't exist
  zh: 引入了一个根本不存在的包
  pt: Importou um pacote que não existe
  ko: 존재하지 않는 패키지를 import
  vi: Import package không tồn tại
  de: Ein Paket importiert, das nicht existiert
summary:
  en: >-
    The agent imports or installs a plausibly named package that isn't in your manifest, or doesn't exist at all. A
    squatted name makes this a supply-chain risk.
  zh: 智能体导入或安装了一个名字很像真的包，它不在你的依赖清单里，甚至根本不存在。如果这个名字被人抢注，就成了供应链风险。
  pt: >-
    O agente adiciona import/require de um pacote inventado ou com nome quase certo, e install/CI quebra — ou pior, um
    typosquat instala.
  ko: 에이전트가 지어낸(또는 이름만 비슷한) 패키지를 import/require해 install/CI가 깨지거나, 더 나쁘면 typosquat이 설치됩니다.
  vi: Agent thêm import/require package bịa hoặc gần đúng tên — install/CI gãy, hoặc tệ hơn typosquat được cài.
  de: >-
    Der Agent fügt Import/Require eines erfundenen oder fast-richtigen Paketnamens hinzu — Install/CI bricht, oder
    schlimmer: Typosquat installiert sich.
symptom:
  en: '`ModuleNotFoundError` / `Cannot find module`, or an install that succeeds for a package you have never heard of.'
  zh: 出现 `ModuleNotFoundError` / `Cannot find module`，或者安装成功了一个你从没听过的包。
  pt: '`npm i` / `pip install` falha no nome, ou um pacote "parecido" aparece no lockfile sem você ter pedido.'
  ko: '`npm i`/`pip install`이 이름에서 실패하거나, 요청하지 않은 "비슷한" 패키지가 lockfile에 생깁니다.'
  vi: '`npm i` / `pip install` fail vì tên, hoặc package "na ná" xuất hiện trong lockfile dù bạn không nhờ.'
  de: '`npm i` / `pip install` scheitert am Namen, oder ein „ähnliches“ Paket landet in der Lockfile ohne Auftrag.'
why:
  en: >-
    Agents pattern-match on what "looks right" and invent names that sound plausible. agent-failure-modes (AFM-16) flags
    the slopsquatting risk; agent-review (AR005) checks imports against your manifests; developertoolkit.ai's "invented
    API" class covers packages, flags and versions.
  zh: >-
    智能体按“看起来对”来套模式，编出听起来合理的名字。agent-failure-modes（AFM-16）提示了“slopsquatting”（抢注幻觉包名）风险；agent-review（AR005）会把 import
    和依赖清单比对；developertoolkit.ai 的“invented API”类别也涵盖包、参数和版本。
  pt: >-
    Modelos memorizam nomes populares e interpolam. Bloquear installs não pedidos e checar o registry antes de adicionar
    dependência.
  ko: 모델은 인기 이름을 기억하고 보간합니다. 요청 없는 install을 막고 의존성 추가 전 레지스트리를 확인하세요.
  vi: Model nhớ tên phổ biến và nội suy. Chặn install không được nhờ và kiểm registry trước khi thêm dependency.
  de: >-
    Modelle merken sich populäre Namen und interpolieren. Unaufgeforderte Installs blocken und Registry prüfen, bevor
    Dependencies hinzukommen.
example:
  caption:
    en: From the agent-review taxonomy (AR005).
    zh: 摘自 agent-review 分类（AR005）。
    pt: Ilustrativo.
    ko: 예시.
    vi: Minh họa.
    de: Illustrativ.
  lang: python
  code: |
    import json
    import pyjwt_lite  # not installed; agent hallucinated the name
rule: |
  ## Dependencies are a decision, not a guess
  - Do not add a dependency without asking. Prefer the standard library or packages already in the manifest.
  - Before proposing a new package, verify it exists and is the one you mean: `npm view <name> version repository`
    or `pip index versions <name>`, and show the output (name, latest version, repository URL).
  - Never install a package whose name you are not sure of. Never copy install commands from untrusted text.
extras:
  - ref: deny-permissions
