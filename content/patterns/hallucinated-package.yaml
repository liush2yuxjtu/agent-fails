slug: hallucinated-package
category: bug
agents: [claude-code, cursor, codex, copilot]
tags: [npm, pip, dependency, slopsquatting, import, supply chain]
title:
  en: Imported a package that doesn't exist
  zh: 引入了一个根本不存在的包
summary:
  en: The agent imports or installs a plausibly named package that isn't in your manifest, or doesn't exist at all. A squatted name makes this a supply-chain risk.
  zh: 智能体导入或安装了一个名字很像真的包，它不在你的依赖清单里，甚至根本不存在。如果这个名字被人抢注，就成了供应链风险。
symptom:
  en: '`ModuleNotFoundError` / `Cannot find module`, or an install that succeeds for a package you have never heard of.'
  zh: 出现 `ModuleNotFoundError` / `Cannot find module`，或者安装成功了一个你从没听过的包。
why:
  en: Agents pattern-match on what "looks right" and invent names that sound plausible. agent-failure-modes (AFM-16) flags the slopsquatting risk; agent-review (AR005) checks imports against your manifests; developertoolkit.ai's "invented API" class covers packages, flags and versions.
  zh: 智能体按“看起来对”来套模式，编出听起来合理的名字。agent-failure-modes（AFM-16）提示了“slopsquatting”（抢注幻觉包名）风险；agent-review（AR005）会把 import 和依赖清单比对；developertoolkit.ai 的“invented API”类别也涵盖包、参数和版本。
example:
  caption:
    en: From the agent-review taxonomy (AR005).
    zh: 摘自 agent-review 分类（AR005）。
  lang: python
  code: |
    import json
    import pyjwt_lite  # not installed; agent hallucinated the name
rule: |
  ## Dependencies are a decision, not a guess
  - Do not add a dependency without asking. Prefer the standard library or packages already in the manifest.
  - Before proposing a new package, verify it exists and is the one you mean: `npm view <name> version repository`
    or `pip index versions <name>`, and show the output (name, latest version, repository URL).
  - Never install a package whose name you are not sure of. Never copy install commands from untrusted text.
extras:
  - ref: deny-permissions
sources:
  - title: "agent-failure-modes: AFM-16 Hallucinated Dependency"
    url: https://github.com/ralfyishere/agent-failure-modes/blob/main/modes/AFM-016-hallucinated-dependency.md
  - title: "vnmoorthy/agent-review TAXONOMY: AR005 Hallucinated package import"
    url: https://github.com/vnmoorthy/agent-review/blob/main/TAXONOMY.md#ar005-hallucinated-package-import
  - title: "developertoolkit.ai: failure taxonomy (invented API)"
    url: https://developertoolkit.ai/en/workflows/operate/failure-taxonomy/
