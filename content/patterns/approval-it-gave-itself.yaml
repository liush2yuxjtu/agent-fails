slug: approval-it-gave-itself
category: overreach
agents:
  - claude-code
tags:
  - plan mode
  - approval
  - go
  - implemented without asking
  - ExitPlanMode
title:
  en: '"I''ll take that as a go" (you never said go)'
  zh: “我就当你同意了”（你根本没说同意）
  pt: '"Vou tomar isso como um go" (você nunca disse go)'
  ko: '"그걸 승인으로 칠게요" (당신은 승인한 적 없음)'
  vi: '"Tôi coi đó là lệnh bắt đầu" (bạn chưa bao giờ nói go)'
  de: „Ich nehme das als Go“ (Sie haben nie Go gesagt)
summary:
  en: >-
    The agent asks for approval of a plan, then treats something that is not approval (a shell command you ran, an
    interrupt, a tool error, silence) as the green light and starts editing files.
  zh: 智能体请你批准计划，随后却把并非批准的东西（你自己跑的一条命令、一次中断、一个工具报错、沉默）当成放行信号，开始改文件。
  pt: >-
    O agente pede aprovação de um plano e trata algo que não é aprovação (um comando shell que você rodou, uma
    interrupção, um erro de ferramenta, silêncio) como sinal verde e começa a editar arquivos.
  ko: 에이전트가 계획 승인을 물은 뒤, 승인이 아닌 것(직접 실행한 셸, 중단, 도구 오류, 침묵)을 초록불로 해석하고 파일 편집을 시작합니다.
  vi: >-
    Agent xin phê duyệt kế hoạch, rồi coi thứ không phải phê duyệt (lệnh shell bạn chạy, bị ngắt, lỗi tool, im lặng) là
    đèn xanh và bắt đầu sửa file.
  de: >-
    Der Agent fragt nach Freigabe eines Plans und behandelt etwas, das keine Freigabe ist (ein Shell-Befehl von Ihnen,
    ein Interrupt, ein Tool-Fehler, Stille), als Grünlicht und beginnt Dateien zu editieren.
symptom:
  en: >-
    You are still reviewing or editing the plan, and new files or edits appear. The transcript says something like "I'll
    take that as a signal to start implementing" right after an action of yours that wasn't a reply to the question.
  zh: 你还在审阅或修改计划，新文件和改动就出现了。记录里在你某个并非回答该问题的操作之后，紧跟着一句类似“我就把这当作开始实现的信号”。
  pt: >-
    Você ainda está revisando ou editando o plano, e novos arquivos ou edits aparecem. O transcript diz algo como "I'll
    take that as a signal to start implementing" logo após uma ação sua que não era resposta à pergunta.
  ko: >-
    아직 계획을 검토·수정 중인데 새 파일이나 편집이 나타납니다. 기록에는 질문에 대한 답이 아닌 당신의 동작 직후에 "I'll take that as a signal to start implementing"
    같은 말이 나옵니다.
  vi: >-
    Bạn vẫn đang xem/sửa kế hoạch thì file mới hoặc edit xuất hiện. Transcript nói kiểu "I'll take that as a signal to
    start implementing" ngay sau một hành động của bạn không phải câu trả lời.
  de: >-
    Sie reviewen oder editieren den Plan noch, und neue Dateien oder Edits erscheinen. Das Transcript sagt etwas wie
    „I'll take that as a signal to start implementing“ direkt nach einer Ihrer Aktionen, die keine Antwort auf die Frage
    war.
why:
  en: >-
    Agents are pulled toward finishing, so any ambiguous signal resolves toward "proceed". @PoliticalMessi: Claude Code
    said "say \"go\" and I'll start implementing", they ran `git checkout -b` in manual shell mode, and it replied "I'll
    take that as a signal to start implementing..." ("I never said that!!"). Claude Code issues report the same from the
    harness side: after the user chose "No, keep planning", a later ExitPlanMode error ("If your plan was already
    approved, continue with implementation") was read as approval (#50176); an interrupted approval request left the
    model told it could now make edits (#81976).
  zh: >-
    智能体天然倾向于“做完”，所以任何含糊的信号都会被解读成“继续”。@PoliticalMessi 的经历：Claude Code 说“说 \"go\" 我就开始实现”，他在手动 shell 模式里跑了 `git checkout
    -b`，它回答“我就把这当作开始实现的信号……”（“我根本没这么说！！”）。Claude Code 的 issue 里也有来自工具层面的同类报告：用户选了“No, keep planning”之后，一次 ExitPlanMode
    报错（“如果计划已获批准，请继续实现”）被当成了批准（#50176）；中断批准请求后，模型被告知可以开始改文件（#81976）。
  pt: >-
    Agentes são puxados a terminar, então qualquer sinal ambíguo resolve para "prosseguir". @PoliticalMessi: Claude Code
    disse "say \"go\" and I'll start implementing", ele rodou `git checkout -b` em shell manual, e a resposta foi "I'll
    take that as a signal to start implementing..." ("I never said that!!"). Issues do Claude Code relatam o mesmo no
    harness: depois de "No, keep planning", um erro ExitPlanMode ("If your plan was already approved, continue with
    implementation") foi lido como aprovação (#50176); um pedido de aprovação interrompido deixou o modelo informado de
    que já podia editar (#81976).
  ko: >-
    에이전트는 '끝내기'로 끌리므로 모호한 신호는 "진행"으로 해석됩니다. @PoliticalMessi: Claude Code가 "say \"go\" and I'll start implementing"이라고
    했고, 수동 셸에서 `git checkout -b`를 실행하자 "I'll take that as a signal to start implementing..."이라고 답했습니다("I never said
    that!!"). Claude Code 이슈에도 하네스 쪽 동일 사례가 있습니다: "No, keep planning" 이후 ExitPlanMode 오류("If your plan was already
    approved, continue with implementation")가 승인으로 읽힘(#50176); 승인 요청이 중단된 뒤 모델이 이제 편집해도 된다고 안내받음(#81976).
  vi: >-
    Agent bị kéo về phía hoàn thành, nên tín hiệu mơ hồ nào cũng thành "tiếp tục". @PoliticalMessi: Claude Code nói "say
    \"go\" and I'll start implementing", anh chạy `git checkout -b` ở shell thủ công, nó trả lời "I'll take that as a
    signal to start implementing..." ("I never said that!!"). Issue Claude Code cũng báo từ phía harness: sau "No, keep
    planning", lỗi ExitPlanMode ("If your plan was already approved, continue with implementation") bị đọc là phê duyệt
    (#50176); yêu cầu phê duyệt bị ngắt khiến model được bảo là có thể edit (#81976).
  de: >-
    Agenten ziehen zum Fertigstellen, daher löst jedes mehrdeutige Signal Richtung „weiter“. @PoliticalMessi: Claude
    Code sagte „say \"go\" and I'll start implementing“, er lief `git checkout -b` im manuellen Shell, und die Antwort
    war „I'll take that as a signal to start implementing...“ („I never said that!!“). Claude-Code-Issues berichten
    dasselbe aus dem Harness: nach „No, keep planning“ wurde ein ExitPlanMode-Fehler („If your plan was already
    approved, continue with implementation“) als Freigabe gelesen (#50176); eine unterbrochene Freigabeanfrage ließ dem
    Modell sagen, es dürfe jetzt editieren (#81976).
example:
  caption:
    en: Reconstructed from @PoliticalMessi's post.
    zh: 根据 @PoliticalMessi 的帖子还原。
    pt: Reconstruído do post de @PoliticalMessi.
    ko: '@PoliticalMessi 포스트에서 재구성.'
    vi: Tái dựng từ bài của @PoliticalMessi.
    de: Rekonstruiert aus dem Post von @PoliticalMessi.
  lang: text
  code: |
    You:    /plan add rate limiting to the API
    Agent:  ...plan... Say "go" and I'll start implementing.
    You:    ! git checkout -b rate-limit        (manual shell, not a reply)
    Agent:  I'll take that as a signal to start implementing...
            Edit src/api/middleware.ts  ...
rule: |
  ## Only an explicit yes is approval
  - When you have asked the user to approve a plan or say "go", wait for a message from the user that
    clearly approves it. Nothing else counts: not a command the user ran, an interrupt, a tool error or
    status message, a timeout, or your own guess.
  - If you are unsure whether you were approved, ask again in one line. Do not edit files while unsure.
  - Implement only what was approved. If the plan grew while you wrote it, show the extra items and ask.
