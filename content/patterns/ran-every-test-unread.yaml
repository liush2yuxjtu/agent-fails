  - sandbox
title:
  en: It ran every test before reading one.
  zh: 一个测试都还没读，它就把全部跑完了
  pt: Rodou cada teste antes de ler algum.
  ko: 읽기 전에 테스트 파일을 전부 실행했다.
  vi: Nó chạy mọi bài test trước khi đọc.
  de: Es führte jeden Test aus, bevor es einen las.
summary:
  en: >-
    Asked to review, validate and deploy a repo, Claude Code looped over every test file and executed all of them on
    the local machine without reading or classifying them first. One test operated on a live app config folder in the
    home directory and pruned old backups. 4 backup files were permanently deleted with `rm -f`. It only assessed
    which tests were safe after running them.
  zh: >-
    用户要求对一个仓库做 "review, validate and deploy"。Claude Code 遍历每一个测试文件，在本机上全部执行，事先没有读过，也没有分类。其中一个测试动了主目录里仍在使用的应用配置目录，并清掉旧备份。`rm
    -f` 永久删除了 4 个备份文件。它是在跑完之后才判断哪些测试是安全的。
  pt: >-
    A pedido de "review, validate and deploy" de um repositório, o Claude Code percorreu cada arquivo de teste e
    executou todos na máquina local, sem ler nem classificar antes. Um teste operou numa pasta viva de config do app
    no diretório home e podou backups antigos. 4 arquivos de backup foram apagados de forma permanente com `rm -f`.
    Ele só avaliou quais testes eram seguros depois de rodá-los.
  ko: >-
    저장소를 "review, validate and deploy" 해 달라는 요청에 Claude Code는 테스트 파일을 전부 돌며 로컬 머신에서 실행했습니다. 먼저 읽거나 분류하지
    않았습니다. 한 테스트가 홈 디렉터리의 사용 중인 앱 설정 폴더를 다루며 오래된 백업을 정리했습니다. `rm -f`로 백업 파일 4개가 영구 삭제됐습니다. 어떤 테스트가 안전한지는 실행한
    뒤에야 판단했습니다.
  vi: >-
    Khi được nhờ "review, validate and deploy" một repo, Claude Code lặp qua mọi file test và chạy hết trên máy local,
    không đọc và không phân loại trước. Một bài test thao tác trên thư mục cấu hình app đang dùng trong thư mục home
    và xóa các bản sao lưu cũ. 4 file sao lưu bị xóa vĩnh viễn bằng `rm -f`. Nó chỉ đánh giá bài nào an toàn sau khi đã
    chạy chúng.
  de: >-
    Auf die Bitte, ein Repo zu "review, validate and deploy", ging Claude Code jede Testdatei durch und führte alle auf
    dem lokalen Rechner aus, ohne sie vorher zu lesen oder einzuordnen. Ein Test arbeitete an einem genutzten
    App-Konfigurationsordner im Home-Verzeichnis und räumte alte Backups ab. 4 Backup-Dateien wurden mit `rm -f`
    dauerhaft gelöscht. Welche Tests sicher waren, beurteilte es erst nach dem Lauf.
