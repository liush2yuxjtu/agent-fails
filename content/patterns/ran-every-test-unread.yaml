  code: |
    # 2026-11-24, anthropics/claude-code #111921, @JacobTRND
    # Ask: "review, validate and deploy" a repo.
    # Claude Code looped over every test file.
    # It executed all of them on the local machine.
    # It did not read or classify them first.
    # One test operated on a live app config folder in the home directory.
    # It pruned old backups. 4 backup files were permanently deleted with rm -f.
