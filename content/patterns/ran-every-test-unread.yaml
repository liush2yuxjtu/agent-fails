rule: |
  ## Read a test before you run it
  - Read and classify every script/test before running it.
  - Never run anything that touches files outside the repo without asking.
  - Run the project's documented test command, not a loop over every file.
  - Run tests in a container or sandbox, or with HOME pointed at a temp dir.
extras:
  - kind: ci
    title:
      en: Point HOME at a temp dir for the test command
      zh: 跑测试时把 HOME 指到临时目录
      pt: Apontar HOME para um diretório temporário no comando de teste
      ko: 테스트 명령의 HOME을 임시 디렉터리로 두기
      vi: Trỏ HOME vào thư mục tạm khi chạy lệnh test
      de: HOME für den Testbefehl auf ein Temp-Verzeichnis setzen
    file: run-tests.sh
    lang: bash
    note:
      en: >-
        HOME points at a new temp dir, so a test that writes under the home directory does not touch the real one.
        Replace `npm test` with the project's documented test command. A container or sandbox is the other option in
        the rule. Read and classify the tests before this line.
      zh: >-
        HOME 指向一个新建的临时目录，这样往主目录里写文件的测试不会碰到真正的主目录。把 `npm test` 换成项目文档里的测试命令。规则里的另一个选择是容器或沙箱。跑这一行之前，先读过并给测试分类。
      pt: >-
        HOME aponta para um diretório temporário novo, então um teste que escreve sob o home não mexe no home real.
        Troque `npm test` pelo comando de teste documentado do projeto. Container ou sandbox é a outra opção da regra.
        Leia e classifique os testes antes desta linha.
      ko: >-
        HOME이 새 임시 디렉터리를 가리키므로, 홈 아래에 쓰는 테스트가 실제 홈을 건드리지 않습니다. `npm test`는 프로젝트 문서의 테스트 명령으로 바꾸세요. 규칙의 다른 선택은
        컨테이너나 샌드박스입니다. 이 줄 전에 테스트를 읽고 분류하세요.
      vi: >-
        HOME trỏ vào một thư mục tạm mới, nên bài test ghi dưới thư mục home không đụng home thật. Đổi `npm test` thành
        lệnh test trong tài liệu của dự án. Container hoặc sandbox là lựa chọn còn lại trong rule. Đọc và phân loại các
        bài test trước dòng này.
      de: >-
        HOME zeigt auf ein neues Temp-Verzeichnis, also trifft ein Test, der unter Home schreibt, nicht das echte Home.
        Ersetzen Sie `npm test` durch den dokumentierten Testbefehl des Projekts. Ein Container oder eine Sandbox ist
        die andere Option in der Regel. Lesen und ordnen Sie die Tests ein, bevor diese Zeile läuft.
    code: |
      # Documented test command, with HOME pointed at a temp dir.
      # Read and classify every test before this.
      HOME=$(mktemp -d) npm test
