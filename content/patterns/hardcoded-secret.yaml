slug: hardcoded-secret
category: bug
agents:
  - claude-code
  - cursor
  - codex
  - copilot
tags:
  - api key
  - secret
  - credential
  - security
  - env
title:
  en: API key pasted into the code
  zh: 把 API 密钥直接写进代码
  pt: API key colada no código
  ko: 코드에 API 키를 붙여넣음
  vi: Dán API key vào code
  de: API-Key in den Code geklebt
summary:
  en: >-
    The agent inlines a credential (from an example, a test, or something you pasted in chat) into source code, and it
    gets committed.
  zh: 智能体把凭据（来自示例、测试，或你在聊天里贴的内容）直接写进源码，然后被提交了。
  pt: O agente coloca secrets em source, exemplos ou commits "só pra testar", e eles vazam no git history.
  ko: 에이전트가 "테스트용"으로 시크릿을 소스·예제·커밋에 넣고 git history로 유출됩니다.
  vi: Agent nhét secret vào source, ví dụ hoặc commit "chỉ để test", rồi lộ trong git history.
  de: Der Agent steckt Secrets in Source, Beispiele oder Commits „nur zum Testen“ — und sie leaken in der Git-History.
symptom:
  en: '`const key = "sk-..."` in a source file, a token in a config committed to git, or a `.env` file added to the repo.'
  zh: 源文件里出现 `const key = "sk-..."`、提交进 git 的配置里有 token，或 `.env` 被加进了仓库。
  pt: '`sk-...`, tokens, connection strings em arquivos trackeados; secret scan ou reviewer humano pega depois.'
  ko: 추적되는 파일에 `sk-...`·토큰·커넥션 스트링; 시크릿 스캔이나 사람 리뷰어가 나중에 잡습니다.
  vi: '`sk-...`, token, connection string trong file được track; secret scan hoặc reviewer người bắt sau.'
  de: '`sk-...`, Tokens, Connection Strings in getrackten Dateien; Secret-Scan oder menschlicher Reviewer fängt später.'
why:
  en: >-
    To an agent, a key is just a string that makes the example work. agent-review lists AR018 "Hardcoded credential" as
    Critical; developertoolkit.ai's security class puts the control in CI (secret scanning).
  zh: 在智能体眼里，密钥只是一个能让示例跑起来的字符串。agent-review 把 AR018“硬编码凭据”列为最高严重级；developertoolkit.ai 的安全类别把控制点放在 CI（密钥扫描）。
  pt: >-
    Colar a key é o caminho mais curto para "funcionar local". Deny permissions em arquivos `.env`/secret e scanners no
    CI.
  ko: 키를 붙이는 게 "로컬에서 되게" 하는 최단 경로입니다. `.env`/시크릿 파일 deny와 CI 스캐너가 필요합니다.
  vi: Dán key là đường ngắn nhất để "chạy local". Deny permission trên `.env`/secret và scanner trong CI.
  de: >-
    Den Key einzufügen ist der kürzeste Weg zu „läuft lokal“. Deny-Permissions auf `.env`/Secret-Dateien und Scanner in
    CI.
example:
  caption:
    en: From the agent-review taxonomy (AR018).
    zh: 摘自 agent-review 分类（AR018）。
    pt: Ilustrativo.
    ko: 예시.
    vi: Minh họa.
    de: Illustrativ.
  lang: ts
  code: |
    const key = "sk-proj-abc123def456...";
rule: |
  ## Secrets never go in code
  - Read credentials from environment variables or the project's secret manager. Never write a real
    key, token or password into source, tests, docs or config, even temporarily.
  - If the user pastes a secret into chat, do not copy it into any file. Reference an env var name
    instead and tell them where to set it.
  - Never `git add` `.env*` files. Check `git diff --cached` for secrets before committing.
extras:
  - ref: deny-permissions
  - kind: ci
    title:
      en: Secret scanning in CI (gitleaks)
      zh: CI 中的密钥扫描（gitleaks）
    file: .github/workflows/gitleaks.yml
    lang: yaml
    code: |
      name: gitleaks
      on: [pull_request, push]
      jobs:
        scan:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 0 }
            - uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
sources:
  - title: 'vnmoorthy/agent-review TAXONOMY: AR018 Hardcoded credential'
    url: https://github.com/vnmoorthy/agent-review/blob/main/TAXONOMY.md#ar018-hardcoded-credential
  - title: 'developertoolkit.ai: failure taxonomy (security)'
    url: https://developertoolkit.ai/en/workflows/operate/failure-taxonomy/
