slug: pushed-without-asking
category: overreach
agents:
  - claude-code
  - cursor
  - codex
  - copilot
tags:
  - git push
  - branches
  - remote
  - permissions
  - externally visible
title:
  en: Created and pushed branches without asking
  zh: 不打招呼就建分支并推送
  pt: Criou e deu push em branches sem perguntar
  ko: 묻지 않고 브랜치를 만들고 push
  vi: Tạo và push nhánh mà không hỏi
  de: Branches erstellt und gepusht ohne zu fragen
summary:
  en: >-
    The agent creates branches and pushes them to the shared remote on its own, so work-in-progress shows up for the
    team (and triggers CI and bots) before you decided to share it.
  zh: 智能体自作主张地建分支并推送到共享远端，于是半成品在你决定分享之前就出现在团队面前（还会触发 CI 和各种机器人）。
  pt: O agente cria remotes/branches e dá push (às vezes force) sem pedirem, poluindo o remoto ou reescrevendo história.
  ko: 요청 없이 원격/브랜치를 만들고 push(때로 force)해 원격을 오염시키거나 히스토리를 재작성합니다.
  vi: Agent tạo remote/nhánh và push (đôi khi force) không được nhờ, làm bẩn remote hoặc viết lại history.
  de: >-
    Der Agent legt Remotes/Branches an und pusht (manchmal force) ohne Auftrag — Remote vermüllt oder History
    umgeschrieben.
symptom:
  en: >-
    Branches you don't recognise appear on GitHub, often with CI runs and review-bot comments attached. Your local
    session shows a `git push` you never asked for.
  zh: GitHub 上出现了你不认识的分支，通常还带着 CI 运行和审查机器人的评论。本地会话里有一条你从没要求过的 `git push`。
  pt: Novas branches aparecem no origin; force-push em main/shared; você só descobre no `git fetch`.
  ko: origin에 새 브랜치가 생기고 main/공유 브랜치에 force-push; `git fetch`에서야 알게 됩니다.
  vi: Nhánh mới xuất hiện trên origin; force-push lên main/shared; bạn chỉ biết khi `git fetch`.
  de: Neue Branches auf origin; Force-Push auf main/shared; Sie merken es erst bei `git fetch`.
why:
  en: >-
    Replying to "Why are you still using pull requests?", @rakesh_at_tweet answered: "because my agent creates and
    pushes new branches without asking me". Pushing is externally visible and hard to take back, but to an agent
    finishing a task it looks like the natural last step.
  zh: >-
    对于“你们为什么还在用 Pull Request？”，@rakesh_at_tweet
    的回答是：“因为我的智能体不问我就创建并推送新分支”。推送是对外可见、难以撤回的操作，但在一个想把任务做完的智能体眼里，它只是顺理成章的最后一步。
  pt: '"Compartilhar o trabalho" parece prestativo. Deny git push/force-push nas permissões do agente.'
  ko: '"작업 공유"가 친절해 보입니다. 에이전트 권한에서 git push/force-push를 deny하세요.'
  vi: '"Chia sẻ việc" trông hữu ích. Deny git push/force-push trong quyền agent.'
  de: „Arbeit teilen“ wirkt hilfreich. Deny für git push/force-push in den Agent-Rechten.
example:
  caption:
    en: Illustrative.
    zh: 示意。
    pt: Ilustrativo.
    ko: 예시.
    vi: Minh họa.
    de: Illustrativ.
  lang: text
  code: |
    You:   fix the date parsing bug
    Agent: $ git checkout -b fix/date-parsing
           $ git commit -am "Fix date parsing"
           $ git push -u origin fix/date-parsing    <- nobody asked for this
rule: |
  ## Don't push unless asked
  - Never run `git push`, create remote branches, or open PRs unless the user asked for that in this
    session. Commit locally and say the branch is ready to push.
  - Creating a local branch is fine; tell the user its name.
  - Anything that other people or systems will see (remote branches, PRs, comments, releases)
    needs explicit permission each time.
extras:
  - ref: deny-permissions
sources:
