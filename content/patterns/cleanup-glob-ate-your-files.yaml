    pelo menos 15 imagens do usuário que o subagent não criou.
  ko: >-
    정리 뒤에 작업 디렉터리의 상위가 없습니다. 로그에는 bypassPermissions에서 `C:/Users/<u>/Desktop/<Project>`에 접두 글롭을 붙인 `rm -rf`가
    있고, 질문은 없습니다. 약 30,000개 파일, 23 GB가 영구 삭제됐고, Git Bash의 rm은 휴지통을 쓰지 않았습니다. 다른 보고에서는 `rm -f /tmp/d0*
