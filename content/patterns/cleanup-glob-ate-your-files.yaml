example:
  caption:
    en: "Paraphrase of #111167 and #112007. The rm lines are the commands in the reports. Paths stay redacted."
    zh: "#111167 和 #112007 的转述。rm 那几行是报告里的命令。路径仍作了省略。"
    pt: "Paráfrase de #111167 e #112007. As linhas de rm são os comandos dos relatos. Os paths seguem ocultos."
    ko: "#111167과 #112007의 바꿔 쓰기. rm 줄은 보고에 나온 명령입니다. 경로는 그대로 가려 둡니다."
    vi: "Diễn lại #111167 và #112007. Các dòng rm là lệnh trong báo cáo. Đường dẫn vẫn được che."
    de: "Paraphrase von #111167 und #112007. Die rm-Zeilen sind die Befehle aus den Berichten. Pfade bleiben geschwärzt."
  lang: text
  code: |
    # 2026-11-19, anthropics/claude-code #111167, @lolancefrelas-lang
    # Workflow subagent. An unquoted path with spaces created a stray folder:
    #   C:/Users/<u>/Desktop/<Project>
    # Then, in bypassPermissions, it ran:
    #   rm -rf "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null
    # The prefix glob also matched <Project Name>, a parent of the working directory
    # and a documented critical path.
    # The critical-path rm check does not expand prefix globs.
    # No prompt. No denial.
    # About 30,000 files, 23 GB, 6 months of work, permanently deleted.
    # Git Bash rm skips the Recycle Bin.
    #
    # 2026-11-24, anthropics/claude-code #112007, @ReyAdrian520
    # Subagent briefed to write nothing. Git Bash on Windows. Scratch went to /tmp.
    # Cleanup:
    #   rm -f /tmp/d0* /tmp/e_* /tmp/f_*
    # The wildcards matched files it had not created.
    # At least 15 user images were deleted. They have since been recovered.
    # Expected: a private mktemp -d folder, and deletion of that folder only.
rule: |
  ## Never delete with wildcards
  - Never delete with wildcards. Put scratch output in a private `mktemp -d` dir, record every path you create, and
    delete only those exact paths or that dir.
  - Before any rm/rmdir, print the expanded target list and stop if it includes anything you did not create.
  - Do not append `*` or `?` to a path. A quoted prefix plus `*` is still a glob, and it matches every name that
    starts with that prefix.
  - For the private dir, use `d=$(mktemp -d)` and later `rm -rf -- "${d:?}"`.
extras:
  - kind: ci
    title:
      en: Delete the private scratch dir, not a glob
      zh: 删掉私有草稿目录，而不是通配符
      pt: Apagar o diretório privado de rascunho, não um glob
      ko: 글롭이 아니라 비공개 임시 디렉터리를 지우기
      vi: Xóa thư mục nháp riêng, không xóa bằng glob
      de: Den privaten Notizordner löschen, kein Glob
    file: scratch-dir.sh
    lang: bash
    note:
      en: >-
        `d` comes from `mktemp -d`. Record any other path you create and delete only those exact paths.
        `"${d:?}"` aborts when `d` is empty or unset. Do not add `*` or `?`.
      zh: >-
        `d` 来自 `mktemp -d`。记下你创建的其他路径，只删除那些确切路径。`d` 为空或未设置时，`"${d:?}"` 会中止。不要再加 `*` 或 `?`。
      pt: >-
        `d` vem de `mktemp -d`. Anote qualquer outro path que você criar e apague só esses paths exatos. `"${d:?}"`
        aborta se `d` estiver vazio ou indefinido. Não acrescente `*` nem `?`.
      ko: >-
        `d`는 `mktemp -d`에서 옵니다. 따로 만든 경로는 기록하고, 그 정확한 경로만 지우세요. `d`가 비었거나 없으면 `"${d:?}"`가 중단합니다. `*`나 `?`를
        붙이지 마세요.
      vi: >-
        `d` lấy từ `mktemp -d`. Ghi lại mọi đường dẫn khác bạn tạo và chỉ xóa đúng các đường đó. `"${d:?}"` dừng khi
        `d` rỗng hoặc chưa đặt. Đừng thêm `*` hoặc `?`.
      de: >-
        `d` kommt von `mktemp -d`. Jeden weiteren Pfad, den Sie anlegen, notieren und nur genau diese Pfade löschen.
        `"${d:?}"` bricht ab, wenn `d` leer oder nicht gesetzt ist. Kein `*` und kein `?` anhängen.
    code: |
      d=$(mktemp -d)
      # scratch files go only under "$d"; record any other path you create
      rm -rf -- "${d:?}"
  - kind: hook
    title:
      en: 'PreToolUse hook: deny rm commands that contain * or ?'
      zh: 'PreToolUse 钩子：拒绝带 * 或 ? 的 rm'
      pt: 'Hook PreToolUse: recusar rm que contenha * ou ?'
      ko: 'PreToolUse 훅: * 또는 ?가 있는 rm 거부'
      vi: 'Hook PreToolUse: từ chối rm có * hoặc ?'
      de: 'PreToolUse-Hook: rm mit * oder ? ablehnen'
    file: .claude/hooks/deny_rm_wildcard.py
    lang: python
    note:
      en: >-
        Register with matcher "Bash". Claude Code sends the tool call as JSON on stdin. Exit 2 blocks. The script
        removes `${name:?}` before it looks for `*` or `?`, so `rm -rf -- "${d:?}"` still passes. That `:?` is the
        empty-variable guard, not a glob. The check reads the command text and does not expand globs. In #111167 the
        critical-path rm check does not expand prefix globs, and the rm ran. This hook denies the wildcard characters
        in the text. It is a seatbelt, not a sandbox.
      zh: >-
        用 matcher "Bash" 注册。Claude Code 把工具调用以 JSON 写到 stdin。退出码 2 会拦截。脚本先去掉 `${name:?}`，再找 `*` 或
        `?`，所以 `rm -rf -- "${d:?}"` 仍然可以通过。这个 `:?` 是空变量防护，不是通配符。检查只读命令文本，不会展开通配符。#111167
        里，关键路径的 rm 检查不会展开前缀通配符，rm 跑掉了。这个钩子拒绝的是文本里的通配符字符。它是安全带，不是沙箱。
      pt: >-
        Registre com matcher "Bash". O Claude Code manda a tool call como JSON no stdin. Exit 2 bloqueia. O script
        tira `${name:?}` antes de procurar `*` ou `?`, então `rm -rf -- "${d:?}"` ainda passa. Esse `:?` é a guarda de
        variável vazia, não um glob. A checagem lê o texto do comando e não expande globs. Em #111167 a checagem de rm
        em caminho crítico não expande globs de prefixo, e o rm rodou. Este hook recusa os caracteres curinga no
        texto. É um cinto, não uma sandbox.
      ko: >-
        matcher "Bash"로 등록합니다. Claude Code는 도구 호출을 stdin의 JSON으로 보냅니다. 종료 코드 2가 막습니다. 스크립트는 `*`나 `?`를 찾기 전에
        `${name:?}`를 빼므로 `rm -rf -- "${d:?}"`는 통과합니다. 이 `:?`는 빈 변수 가드이고 글롭이 아닙니다. 검사는 명령 텍스트만 읽고 글롭을 펼치지
        않습니다. #111167에서 중요 경로 rm 검사는 접두 글롭을 펼치지 않았고, rm은 실행됐습니다. 이 훅은 텍스트 안의 와일드카드 문자를 거부합니다. 안전벨트이지
        샌드박스가 아닙니다.
      vi: >-
        Đăng ký với matcher "Bash". Claude Code gửi tool call dạng JSON trên stdin. Exit 2 là chặn. Script bỏ
        `${name:?}` trước khi tìm `*` hoặc `?`, nên `rm -rf -- "${d:?}"` vẫn qua. `:?` đó là chặn biến rỗng, không phải
        glob. Bước kiểm chỉ đọc chữ lệnh và không bung glob. Trong #111167, bước kiểm rm trên đường dẫn trọng yếu không
        bung glob tiền tố, và rm đã chạy. Hook này từ chối ký tự wildcard trong chữ lệnh. Đây là dây an toàn, không phải
        sandbox.
      de: >-
        Mit Matcher „Bash“ registrieren. Claude Code schreibt den Tool-Aufruf als JSON auf stdin. Exit 2 blockt. Das
        Skript entfernt `${name:?}`, bevor es nach `*` oder `?` sucht, also bleibt `rm -rf -- "${d:?}"` erlaubt. Dieses
        `:?` ist die Leer-Variablen-Sicherung, kein Glob. Die Prüfung liest den Befehlstext und expandiert keine Globs.
        In #111167 expandiert die rm-Prüfung für kritische Pfade keine Präfix-Globs, und rm lief. Dieser Hook lehnt die
        Wildcard-Zeichen im Text ab. Er ist ein Gurt, keine Sandbox.
    code: |
      #!/usr/bin/env python3
      """Deny rm when the command text still contains * or ?."""
      import json, re, sys

      call = json.load(sys.stdin)
      if call.get("tool_name") not in ("Bash", "Shell"):
          sys.exit(0)
      cmd = call.get("tool_input", {}).get("command", "")
      if not re.search(r"\brm\b", cmd):
          sys.exit(0)
      # ${name:?} is the empty-variable guard in rm -rf -- "${d:?}", not a glob.
      scrubbed = re.sub(r"\$\{[A-Za-z_][A-Za-z0-9_]*:\?\}", "", cmd)
      if re.search(r"[*?]", scrubbed):
          print(
              "BLOCKED: rm command contains * or ?. "
              'Delete exact paths, or only the mktemp -d directory, with rm -rf -- "${d:?}".',
              file=sys.stderr,
          )
          sys.exit(2)
      sys.exit(0)
sources:
  - title: "@lolancefrelas-lang, anthropics/claude-code #111167 (19 Nov 2026): a Workflow subagent created C:/Users/<u>/Desktop/<Project> through an unquoted path with spaces, then ran rm -rf with a prefix glob. The glob also matched <Project Name>, a parent of the working directory and a documented critical path. In bypassPermissions the critical-path rm check does not expand prefix globs, so it ran with no prompt and no denial. About 30,000 files, 23 GB, 6 months of work, were permanently deleted. Git Bash rm skips the Recycle Bin"
    url: https://github.com/anthropics/claude-code/issues/111167
  - title: "@ReyAdrian520, anthropics/claude-code #112007 (24 Nov 2026): a subagent briefed to write nothing used /tmp for scratch in Git Bash on Windows, then ran rm -f /tmp/d0* /tmp/e_* /tmp/f_*. The wildcards matched files it had not created. At least 15 user images were deleted and have since been recovered. Expected cleanup is a private mktemp -d folder and deletion of that folder only"
    url: https://github.com/anthropics/claude-code/issues/112007
