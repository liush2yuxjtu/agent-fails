  vi: >-
    Sau lần dọn, thư mục cha của thư mục làm việc biến mất. Log có `rm -rf` trên `C:/Users/<u>/Desktop/<Project>` kèm
    glob tiền tố, trong bypassPermissions, không hỏi. Khoảng 30,000 file, 23 GB, bị xóa vĩnh viễn, và rm của Git Bash
    không dùng Recycle Bin. Ở báo cáo kia, `rm -f /tmp/d0* /tmp/e_* /tmp/f_*` xóa ít nhất 15 ảnh của người dùng mà
    subagent không tạo.
  de: >-
    Nach dem Aufräumen fehlt ein Elternordner des Arbeitsverzeichnisses. Im Log steht `rm -rf` auf
    `C:/Users/<u>/Desktop/<Project>` mit einem Präfix-Glob, unter bypassPermissions, ohne Rückfrage. Etwa 30,000
    Dateien, 23 GB, sind dauerhaft gelöscht, und rm in Git Bash hat den Papierkorb nicht benutzt. Im anderen Bericht
    löscht `rm -f /tmp/d0* /tmp/e_* /tmp/f_*` mindestens 15 Bilder der Person, die der Subagent nicht angelegt hat.
