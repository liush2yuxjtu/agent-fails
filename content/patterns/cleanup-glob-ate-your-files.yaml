slug: cleanup-glob-ate-your-files
category: overreach
agents:
  - claude-code
tags:
  - wildcard
  - glob
  - rm
  - mktemp
  - data loss
  - bypassPermissions
  - git bash
  - recycle bin
title:
  en: The cleanup glob ate files it did not create.
  zh: 清理用的通配符吃掉了它没创建的文件
  pt: O glob de limpeza comeu arquivos que ele não criou.
  ko: 정리용 와일드카드가 만들지 않은 파일을 지웠다.
  vi: Glob dọn dẹp đã xóa file nó không tạo.
  de: Das Aufräum-Glob löschte Dateien, die es nicht angelegt hatte.
summary:
  en: >-
    A Workflow subagent created a stray folder `C:/Users/<u>/Desktop/<Project>` through an unquoted path with spaces,
    then ran `rm -rf "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null`. The glob also matched `<Project Name>`, a parent of
    the working directory and a documented critical path. In bypassPermissions the critical-path rm check does not
    expand prefix globs, so the command ran with no prompt and no denial. About 30,000 files, 23 GB, 6 months of work,
    were permanently deleted. Git Bash rm skips the Recycle Bin. In a second report, a subagent briefed to write
    nothing used `/tmp` for scratch in Git Bash on Windows and cleaned up with `rm -f /tmp/d0* /tmp/e_* /tmp/f_*`. The
    wildcards matched files it had not created. At least 15 user images were deleted, and have since been recovered.
  zh: >-
    一个 Workflow subagent 用带空格、未加引号的路径造出多余目录 `C:/Users/<u>/Desktop/<Project>`，然后跑了 `rm -rf
    "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null`。这个通配符也匹配到 `<Project Name>`，它是工作目录的上级，也是文档里写明的关键路径。会话处于
    bypassPermissions。关键路径的 rm 检查不会展开前缀通配符，所以命令没有提示、也没有被拒绝。大约 30,000 个文件、23 GB、6
    个月的工作被永久删除。Git Bash 的 rm 不进回收站。另一份报告里，一个被交代什么都不要写的 subagent 在 Windows 的 Git Bash 里把草稿放在
    `/tmp`，再用 `rm -f /tmp/d0* /tmp/e_* /tmp/f_*` 清理。通配符匹配到它没创建的文件。至少 15 张用户图片被删掉，后来已恢复。
  pt: >-
    Um subagent de Workflow criou uma pasta solta `C:/Users/<u>/Desktop/<Project>` por um path com espaços e sem aspas,
    e em seguida rodou `rm -rf "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null`. O glob também casou `<Project Name>`, pai
    do diretório de trabalho e um caminho crítico documentado. Em bypassPermissions, a checagem de rm em caminho
    crítico não expande globs de prefixo, então o comando rodou sem pergunta e sem recusa. Cerca de 30,000 arquivos, 23
    GB, 6 meses de trabalho, foram apagados de forma permanente. O rm do Git Bash não usa a Lixeira. Num segundo
    relato, um subagent instruído a não escrever nada usou `/tmp` como rascunho no Git Bash no Windows e limpou com
    `rm -f /tmp/d0* /tmp/e_* /tmp/f_*`. Os curingas casaram arquivos que ele não criou. Pelo menos 15 imagens do usuário
    foram apagadas e depois recuperadas.
  ko: >-
    Workflow subagent가 공백이 있고 따옴표가 없는 경로로 엉뚱한 폴더 `C:/Users/<u>/Desktop/<Project>`를 만든 뒤 `rm -rf
    "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null`를 실행했습니다. 글롭은 작업 디렉터리의 상위이자 문서에 적힌 중요 경로인 `<Project
    Name>`도 맞았습니다. bypassPermissions에서 중요 경로 rm 검사는 접두 글롭을 펼치지 않아, 명령은 묻지도 거부되지도 않고 실행됐습니다. 약 30,000개
    파일, 23 GB, 6개월 치 작업이 영구 삭제됐습니다. Git Bash의 rm은 휴지통을 쓰지 않습니다. 다른 보고에서는 아무것도 쓰지 말라는 지시를 받은 subagent가
    Windows의 Git Bash에서 `/tmp`를 임시 공간으로 쓴 뒤 `rm -f /tmp/d0* /tmp/e_* /tmp/f_*`로 정리했습니다. 와일드카드가 그것이 만들지 않은
    파일과 맞았습니다. 사용자 이미지 최소 15장이 삭제됐고, 이후 복구됐습니다.
  vi: >-
    Một Workflow subagent tạo thư mục lạc `C:/Users/<u>/Desktop/<Project>` bằng đường dẫn có khoảng trắng và không
    ngoặc, rồi chạy `rm -rf "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null`. Glob cũng khớp `<Project Name>`, thư mục cha
    của thư mục làm việc và là đường dẫn trọng yếu đã được ghi trong tài liệu. Trong bypassPermissions, bước kiểm rm
    trên đường dẫn trọng yếu không bung glob tiền tố, nên lệnh chạy không hỏi và không bị từ chối. Khoảng 30,000 file,
    23 GB, 6 tháng làm việc, bị xóa vĩnh viễn. rm của Git Bash không đưa vào Recycle Bin. Ở báo cáo thứ hai, một
    subagent được dặn không ghi gì đã dùng `/tmp` làm chỗ nháp trong Git Bash trên Windows và dọn bằng `rm -f /tmp/d0*
    /tmp/e_* /tmp/f_*`. Wildcard khớp những file nó không tạo. Ít nhất 15 ảnh của người dùng bị xóa, và sau đó đã được
    khôi phục.
  de: >-
    Ein Workflow-Subagent legte einen überzähligen Ordner `C:/Users/<u>/Desktop/<Project>` über einen ungequoteten Pfad
    mit Leerzeichen an und führte dann `rm -rf "C:/Users/<u>/Desktop/<Project>"* 2>/dev/null` aus. Das Glob traf auch
    `<Project Name>`, einen Elternordner des Arbeitsverzeichnisses und einen dokumentierten kritischen Pfad. Unter
    bypassPermissions expandiert die rm-Prüfung für kritische Pfade keine Präfix-Globs, also lief der Befehl ohne
    Rückfrage und ohne Ablehnung. Etwa 30,000 Dateien, 23 GB, 6 Monate Arbeit, wurden dauerhaft gelöscht. rm in Git
    Bash lässt den Papierkorb aus. In einem zweiten Bericht nutzte ein Subagent, der nichts schreiben sollte, `/tmp`
    als Notizbereich in Git Bash unter Windows und räumte mit `rm -f /tmp/d0* /tmp/e_* /tmp/f_*` auf. Die Wildcards
    trafen Dateien, die er nicht angelegt hatte. Mindestens 15 Bilder der Person wurden gelöscht und seitdem
    wiederhergestellt.
