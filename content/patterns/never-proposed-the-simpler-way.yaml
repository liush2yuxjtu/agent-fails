slug: never-proposed-the-simpler-way
category: overreach
agents: [claude-code, cursor, codex, copilot]
tags: [over-complicated, verbose, bloat, simplicity, design, "should this exist"]
title:
  en: Never proposed the simpler way
  zh: 从不提出更简单的做法
summary:
  en: The agent delivers a working but over-complicated, verbose solution. It rarely says that a smaller change would do, that something isn't needed, or that the change shouldn't be made at all.
  zh: 智能体交出一个能用、但过度复杂又啰嗦的方案。它很少会说“改小一点就够了”“这个不需要”或者“这个改动根本不该做”。
symptom:
  en: Roundabout control flow, extra layers and long comments where a few lines would do. Human reviewers keep leaving the same comment, "there's a simpler way", and the diff shrinks a lot once they do.
  zh: 绕来绕去的控制流、多余的层次、几行就能搞定的地方写了长篇注释。人类审查者反复留下同一条意见：“有更简单的办法”，按他们说的改完，diff 会缩小很多。
why:
  en: 'In replies to Thorsten Ball''s PR post, @lawrjones says he steers the code in 40% of the PRs he merges, often for architectural choices or over-complication where Opus didn''t see a simpler path. @akepka_: even frontier models "will rarely tell you that something is not needed or could be 10 times simpler". @isaacvando often asks to close a PR or redo it in a way that fits the project and notes Codex never suggests closing one. @LucaColonnello sees "silly roundabout ways of doing things" and a lack of questioning why something is needed. @clintwinter13 catches "overly verbose code and bad design"; @benjaminhonorio catches code that is overcomplicated or unnecessary; @GrmlBob finds Opus code badly bloated on big projects; @motziabuelnasr reviews agent PRs that turn out complex to reason about or not scalable; @zeenix finds AI-generated docs and comments unreadable for humans. Agents implement the request as given, and pushing back on its size or necessity is rarely rewarded.'
  zh: '在 Thorsten Ball 的 PR 帖下，@lawrjones 说他合并的 PR 里有 40% 需要他出手调整代码，多半是架构选择问题，或者明明有更简单的路 Opus 却没看到、把代码写复杂了。@akepka_：即使是前沿模型，也“很少会告诉你某样东西不需要，或者可以简单 10 倍”。@isaacvando 经常要求关掉 PR，或用更符合项目的方式重做，他说 Codex 从来不会建议关掉 PR。@LucaColonnello 常看到“绕远路的笨办法”，也缺少对“为什么需要这个”的追问。@clintwinter13 常抓到“过于啰嗦的代码和糟糕的设计”；@benjaminhonorio 抓到过过度复杂或根本不必要的代码；@GrmlBob 发现大项目里 Opus 的代码严重臃肿；@motziabuelnasr 审查的智能体 PR 有的难以理解或无法扩展；@zeenix 觉得 AI 生成的文档和注释人根本读不懂。智能体照单实现需求，而对需求的规模或必要性提出异议，很少得到奖励。'
example:
  caption:
    en: Illustrative.
    zh: 示意。
  lang: ts
  code: |
    // Asked: show the user's display name, falling back to their email
    class DisplayNameResolverFactory {
      create(strategy: "name" | "email" = "name") { return new DisplayNameResolver(strategy); }
    }
    // ...60 more lines...

    // Simpler:
    const displayName = user.name || user.email;
rule: |
  ## Propose the smallest change first
  - Before writing code, state the smallest change that would satisfy the request. Implement that
    unless the user asks for more.
  - If you believe the request isn't needed, or a much simpler approach exists (including reusing
    existing code or not making the change), say so first and let the user choose.
  - No new classes, layers, factories or config options unless the request needs them.
  - Comments explain why, briefly. Don't narrate what the code does.
  - In your summary, name one thing you chose not to build and why.
extras:
