slug: swallowed-finding
category: overreach
agents:
  - claude-code
  - cursor
  - codex
  - copilot
tags:
  - noticed bug
  - report
  - silence
  - adjacent issue
  - parking lot
title:
  en: Noticed the real bug next door and told no one
  zh: 发现了旁边的真 bug，却谁也没告诉
  pt: Notou o bug real ao lado e não contou
  ko: 옆의 진짜 버그를 보고도 말하지 않음
  vi: Thấy bug thật kế bên mà không nói
  de: Den echten Bug daneben bemerkt — und niemandem gesagt
summary:
  en: >-
    The agent sees a genuine problem near its task and neither fixes it nor reports it. Scope rules without a reporting
    channel make this worse.
  zh: 智能体在任务附近看到了一个真问题，既没修，也没报告。只有范围规则、却没有上报渠道时，这种情况会更严重。
  pt: >-
    Enquanto fazia a tarefa, o agente viu um problema adjacente e segurou a informação para "não expandir o escopo" — ou
    esqueceu.
  ko: 작업 중 인접 문제를 보고 "범위를 넓히지 않으려고" 정보를 참거나 잊어버립니다.
  vi: Trong lúc làm việc, agent thấy vấn đề liền kề và giữ im lặng để "không mở rộng scope" — hoặc quên.
  de: >-
    Während der Aufgabe sah der Agent ein Nachbarproblem und hielt es zurück, um „den Scope nicht zu erweitern“ — oder
    vergaß es.
symptom:
  en: Weeks later you hit a bug in a file the agent read during an earlier task, and the transcript shows it noticed.
  zh: 几周后你在某个文件里踩到 bug，翻记录才发现，智能体之前做别的任务时读过这个文件，也注意到了这个问题。
  pt: Você descobre o bug vizinho depois; o transcript mostra que o agente comentou consigo mesmo e seguiu.
  ko: 이웃 버그를 나중에 발견하고, 기록에는 에이전트가 혼잣말하고 넘어간 흔적이 있습니다.
  vi: Bạn phát hiện bug kế sau; transcript cho thấy agent tự nói với mình rồi đi tiếp.
  de: >-
    Sie finden den Nachbar-Bug später; das Transcript zeigt, dass der Agent zu sich selbst kommentierte und
    weitermachte.
why:
  en: >-
    Staying in scope is right, but silence loses the information. agent-failure-modes lists AFM-3 Swallowed Finding
    (Replicated). The dev.to diff-budget author hit the same side effect, where blocked observations "simply vanished",
    and fixed it with a parking-lot file.
  zh: 守住范围是对的，但沉默会让信息丢失。agent-failure-modes 列出了 AFM-3 被吞掉的发现（可复现）。dev.to 那位作者也遇到了同样的副作用：被拦下的观察“就这么消失了”，后来用“停车场”文件解决。
  pt: >-
    Instruções de "não expandir escopo" são lidas como "não reporte". Peça FOLLOWUPS.md ou uma seção explícita de
    findings.
  ko: '"범위 확장 금지" 지시가 "보고하지 마"로 읽힙니다. FOLLOWUPS.md나 명시적 findings 섹션을 요청하세요.'
  vi: Chỉ thị "đừng mở rộng scope" bị đọc thành "đừng báo". Hãy nhờ FOLLOWUPS.md hoặc mục findings rõ.
  de: >-
    „Scope nicht erweitern“ wird als „nicht melden“ gelesen. Bitten Sie um FOLLOWUPS.md oder eine explizite
    Findings-Sektion.
example:
  caption:
    en: From the dev.to diff-budget post (parking lot entry).
    zh: 摘自 dev.to diff budget 文章（停车场条目）。
    pt: Ilustrativo.
    ko: 예시.
    vi: Minh họa.
    de: Illustrativ.
  lang: markdown
  code: |
    ## Parking lot: task-0412
    - src/search/cursor.py has the same off-by-one pattern as the pagination helper.
      Likely the same bug. Suggested task: bug fix, tight budget.
rule: |
  ## Report what you notice, don't silently fix or ignore it
  - If you notice a bug, security issue or risky code outside your task, don't fix it in this change,
    and don't stay silent: add it to FOLLOWUPS.md and mention it in your final summary under "Noticed, not fixed".
  - Include file, line, what's wrong, how sure you are, and a suggested task.
extras:
  - kind: spec
    title:
      en: FOLLOWUPS.md parking lot
      zh: FOLLOWUPS.md“停车场”
    file: FOLLOWUPS.md
    lang: markdown
    code: |
      ## Noticed, not fixed
      - <file:line>: <what is wrong>. Confidence: <high|medium|low>. Suggested task: <type, priority>.
  - ref: verify-skill
sources:
  - title: 'agent-failure-modes: AFM-3 Swallowed Finding'
    url: https://github.com/ralfyishere/agent-failure-modes/blob/main/modes/AFM-003-swallowed-finding.md
  - title: 'dev.to (yureki_lab): the parking lot'
    url: https://dev.to/yureki_lab/how-i-stopped-my-ai-coding-agents-scope-creep-with-a-diff-budget-47lj
