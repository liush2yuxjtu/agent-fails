slug: duplicate-implementation
category: overreach
agents:
  - claude-code
  - cursor
  - codex
  - copilot
tags:
  - duplicate
  - reinvent
  - existing helper
  - second implementation
  - erosion
title:
  en: Rebuilt something that already existed
  zh: 重新造了一个早已存在的轮子
  pt: Reconstruiu algo que já existia
  ko: 이미 있는 것을 다시 만듦
  vi: Xây lại thứ đã tồn tại
  de: Etwas neu gebaut, das schon existierte
summary:
  en: >-
    Instead of finding the existing function, component or service, the agent writes a second one, and now there are two
    to keep in sync.
  zh: 智能体没去找已有的函数、组件或服务，而是又写了一个，从此要同步维护两份。
  pt: >-
    Em vez de reusar um helper/módulo/serviço existente, o agente escreve um paralelo — às vezes pior, às vezes
    sutilmente diferente.
  ko: 기존 helper/모듈/서비스를 재사용하지 않고 병렬 구현을 씁니다 — 더 나쁘거나 미묘하게 다릅니다.
  vi: Thay vì tái dùng helper/module/service có sẵn, agent viết bản song song — đôi khi tệ hơn, đôi khi khác tinh tế.
  de: >-
    Statt einen vorhandenen Helper/Modul/Service zu nutzen, schreibt der Agent eine Parallele — manchmal schlechter,
    manchmal subtil anders.
symptom:
  en: >-
    A new `formatCurrency`, `useDebounce` or `apiClient` next to the one the codebase already uses, with slightly
    different behavior.
  zh: 新出现一个 `formatCurrency`、`useDebounce` 或 `apiClient`，和代码库里已在用的那个并存，行为还略有不同。
  pt: Dois caminhos fazem quase a mesma coisa; o novo não passa pelos testes/contratos do antigo.
  ko: 두 경로가 거의 같은 일을 하고, 새 것은 옛 것의 테스트/계약을 안 탑니다.
  vi: Hai đường làm gần như cùng việc; cái mới không qua test/hợp đồng của cái cũ.
  de: Zwei Pfade tun fast dasselbe; der neue läuft nicht durch die Tests/Verträge des alten.
why:
  en: >-
    Writing new code is faster than searching for old code, and the agent's context rarely includes the whole repo.
    Kaplira's first step is to "check whether the agent found the existing implementation", noting that a second
    implementation can widen the task without fixing its cause. Over time, this is what developertoolkit.ai calls
    erosion.
  zh: >-
    写新代码比找旧代码快，而智能体的上下文很少包含整个仓库。Kaplira 的第一步就是“检查智能体是否找到了现有实现”，并指出再写一份实现会扩大任务范围却没解决根因。久而久之，这就是 developertoolkit.ai
    说的“侵蚀”。
  pt: Achar e confiar no existente exige leitura; gerar de novo é o default. Taxonomias de scope/erosion apontam isso.
  ko: 기존 것을 찾아 신뢰하려면 읽기가 필요하고, 새로 생성하는 게 기본입니다. scope/erosion 분류가 이를 짚습니다.
  vi: Tìm và tin cái có sẵn cần đọc; sinh mới là mặc định. Taxonomy scope/erosion chỉ ra điều này.
  de: Vorhandenes finden und vertrauen braucht Lesen; Neu-Generieren ist Default. Scope-/Erosions-Taxonomien nennen das.
example:
  caption:
    en: Illustrative.
    zh: 示意。
    pt: Ilustrativo.
    ko: 예시.
    vi: Minh họa.
    de: Illustrativ.
  lang: text
  code: |
    existing: src/lib/money.ts       export function formatCurrency(cents, locale)
    new:      src/cart/utils.ts      export const fmtPrice = (n) => "$" + n.toFixed(2)
rule: |
  ## Reuse before you write
  - Before writing a helper, hook, component or client, search the repo for an existing one
    (`rg -n "format.*currency|useDebounce|apiClient" src`) and report what you found.
  - Use the existing implementation. If it doesn't fit, say why, and extend it rather than writing a parallel one.
  - Keep a short "Where things live" section in this file for common utilities.
extras:
  - kind: spec
    title:
      en: '"Where things live" section for CLAUDE.md / AGENTS.md'
      zh: CLAUDE.md / AGENTS.md 中的“东西放在哪”段落
    file: CLAUDE.md
    lang: markdown
    code: |
      ## Where things live (use these, don't recreate them)
      - Money/currency formatting: src/lib/money.ts
      - HTTP client (auth, retries): src/lib/api.ts
      - Date helpers: src/lib/dates.ts
      - Shared UI components: src/components/ui/
sources:
