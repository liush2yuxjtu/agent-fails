rule: |
  ## Treat agent review as one signal, not a gate
  - Never report a change as "reviewed" because review agents approved it. Say which reviewers ran,
    on which model, and what they did not check (architecture, whether the change is needed).
  - For review, use a fresh context that sees only the request and the diff, and if possible a
    different model family from the one that wrote the code.
  - Every finding needs file:line, severity and a way to verify it. Drop findings you can't verify.
  - Stop after one fix round per finding. If a new round only finds new low-severity items,
    report them instead of fixing them, and hand the decision to a human.
  - Always ask: does this change need to exist, and does it reuse what is already in the codebase?
