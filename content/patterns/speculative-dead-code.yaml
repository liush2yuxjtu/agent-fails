    url: https://github.com/vnmoorthy/agent-review/blob/main/TAXONOMY.md#ar001-dead-code-introduced
  - title: "vnmoorthy/agent-review TAXONOMY: AR031 Redundant abstraction"
    url: https://github.com/vnmoorthy/agent-review/blob/main/TAXONOMY.md#ar031-redundant-abstraction
  - title: "vnmoorthy/agent-review TAXONOMY: AR003 Commented-out code left behind"
    url: https://github.com/vnmoorthy/agent-review/blob/main/TAXONOMY.md#ar003-commented-out-code-left-behind
