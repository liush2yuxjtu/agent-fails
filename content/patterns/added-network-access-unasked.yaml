rule: |
  ## Use the design the request named
  - Use the design named in the request and existing code.
  - Before adding outbound network calls, new credential handling, or a new dependency on a remote service, stop,
    explain, and ask.
  - Do not run that new path against live services before the user agrees.
extras:
  - kind: ci
    title:
      en: Review check before accepting the diff
      zh: 接受 diff 之前的审查命令
      pt: Checagem de review antes de aceitar o diff
      ko: diff를 받아들이기 전의 검토 명령
      vi: Lệnh rà soát trước khi nhận diff
      de: Prüfbefehl, bevor der Diff angenommen wird
    file: review-network.sh
    lang: bash
    note:
      en: >-
        Run this on the diff before accepting it. grep prints the matching lines. A hit on `fetch(`, an http URL,
        `Authorization`, or `token` is a line to stop and read. Other HTTP clients do not match this pattern.
      zh: >-
        接受 diff 之前对它跑这一行。grep 会打出匹配的行。命中 `fetch(`、http URL、`Authorization` 或 `token` 的那一行，停下来读。其他 HTTP
        客户端不会匹配这个模式。
      pt: >-
        Rode isto no diff antes de aceitá-lo. O grep imprime as linhas que casam. Um acerto em `fetch(`, uma URL http,
        `Authorization` ou `token` é uma linha para parar e ler. Outros clientes HTTP não casam este padrão.
      ko: >-
        diff를 받아들이기 전에 이 명령을 실행합니다. grep이 맞는 줄을 출력합니다. `fetch(`, http URL, `Authorization`, `token`에 맞으면 그 줄에서
        멈추고 읽으세요. 다른 HTTP 클라이언트는 이 패턴에 맞지 않습니다.
      vi: >-
        Chạy lệnh này trên diff trước khi nhận. grep in các dòng khớp. Một dòng khớp `fetch(`, URL http,
        `Authorization`, hoặc `token` là chỗ dừng lại và đọc. HTTP client khác không khớp mẫu này.
      de: >-
        Führen Sie das am Diff aus, bevor Sie ihn annehmen. grep gibt die passenden Zeilen aus. Ein Treffer auf
        `fetch(`, eine http-URL, `Authorization` oder `token` ist eine Zeile, bei der Sie anhalten und lesen. Andere
        HTTP-Clients treffen dieses Muster nicht.
    code: |
      git diff | grep -nE 'fetch\(|https?://|Authorization|token'
