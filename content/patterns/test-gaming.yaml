    url: https://github.com/ralfyishere/agent-failure-modes/blob/main/modes/AFM-014-test-gaming.md
  - title: "developertoolkit.ai: failure taxonomy (oracle gaming)"
    url: https://developertoolkit.ai/en/workflows/operate/failure-taxonomy/
