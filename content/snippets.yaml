# Shared, reusable fix snippets. Patterns reference these with `- ref: <id>`.
# Each snippet: title (en/zh), file (where it goes), lang, code, optional note (en/zh).


scope-guard-hook:
  kind: hook
  title:
    en: 'Claude Code PreToolUse hook: block edits outside the declared scope'
    zh: Claude Code PreToolUse 钩子：拦截声明范围之外的编辑
    pt: 'Hook PreToolUse do Claude Code: bloquear edits fora do escopo declarado'
    ko: 'Claude Code PreToolUse 훅: 선언된 범위 밖 편집 차단'
    vi: 'Hook PreToolUse Claude Code: chặn edit ngoài scope khai báo'
    de: 'Claude-Code-PreToolUse-Hook: Edits außerhalb des deklarierten Scopes blocken'
  file: .claude/hooks/scope_guard.py
  lang: python
  note:
    en: >-
      Adapted from the diff-budget design on dev.to (yureki_lab). Put allowed globs, one per line, in .agent-scope at
      the repo root. Exit code 2 blocks the tool call and feeds stderr back to the agent. It only covers file-edit
      tools; shell writes still need the diff check.
    zh: >-
      改编自 dev.to（yureki_lab）的 diff budget 设计。在仓库根目录的 .agent-scope 中每行写一个允许的 glob。退出码 2 会阻止该工具调用，并把 stderr
      反馈给智能体。它只覆盖文件编辑工具，shell 写入仍需靠 diff 检查兜底。
    pt: >-
      Adaptado do design de diff-budget no dev.to (yureki_lab). Coloque globs permitidos, um por linha, em .agent-scope
      na raiz. Exit code 2 bloqueia a tool call e devolve stderr ao agente. Só cobre ferramentas de edit de arquivo;
      writes via shell ainda precisam do diff check.
    ko: >-
      dev.to(yureki_lab) diff-budget 설계에서 옮김. 저장소 루트 .agent-scope에 허용 glob을 한 줄에 하나씩. 종료 코드 2는 tool call을 막고 stderr를
      에이전트에 돌려줍니다. 파일 편집 도구만 다루며, 셸 write는 여전히 diff check가 필요합니다.
    vi: >-
      Chuyển từ thiết kế diff-budget trên dev.to (yureki_lab). Đặt glob được phép, mỗi dòng một, trong .agent-scope ở
      root. Exit code 2 chặn tool call và trả stderr cho agent. Chỉ phủ tool edit file; write qua shell vẫn cần diff
      check.
    de: >-
      Angepasst vom Diff-Budget-Design auf dev.to (yureki_lab). Erlaubte Globs, eine pro Zeile, in .agent-scope an der
      Repo-Wurzel. Exit-Code 2 blockt den Tool-Call und gibt stderr an den Agenten. Deckt nur File-Edit-Tools;
      Shell-Writes brauchen weiter den Diff-Check.
  code: |
    #!/usr/bin/env python3
    """PreToolUse hook: block Edit/Write/MultiEdit outside the globs in .agent-scope."""
    import fnmatch, json, os, sys

    call = json.load(sys.stdin)
    if call.get("tool_name") not in ("Edit", "Write", "MultiEdit"):
        sys.exit(0)

    root = os.environ.get("CLAUDE_PROJECT_DIR") or call.get("cwd") or os.getcwd()
    scope_file = os.path.join(root, ".agent-scope")
    if not os.path.exists(scope_file):
        sys.exit(0)  # no scope declared for this task -> allow

    allowed = [l.strip() for l in open(scope_file) if l.strip() and not l.startswith("#")]
    target = os.path.relpath(call["tool_input"]["file_path"], root)

    if any(fnmatch.fnmatch(target, pat) for pat in allowed):
        sys.exit(0)

    print(
        f"BLOCKED: {target} is outside this task's scope ({', '.join(allowed)}).\n"
        "If this edit is required, stop and ask the user to widen .agent-scope, with a one-line reason.\n"
        "If it is just an improvement you noticed, add it to FOLLOWUPS.md and keep going.",
        file=sys.stderr,
    )
    sys.exit(2)
scope-guard-settings:
  kind: settings
  title:
    en: Register the scope guard in .claude/settings.json
    zh: 在 .claude/settings.json 中注册范围守卫
    pt: Registrar o scope guard em .claude/settings.json
    ko: .claude/settings.json에 scope guard 등록
