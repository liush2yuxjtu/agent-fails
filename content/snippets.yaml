diff-budget-check:
  kind: ci
  title:
    en: Diff budget check (run before commit or in CI)
    zh: Diff 预算检查（提交前或在 CI 中运行）
    pt: Checagem de orçamento de diff (antes do commit ou no CI)
    ko: Diff 예산 검사 (커밋 전 또는 CI)
    vi: Kiểm ngân sách diff (trước commit hoặc trong CI)
    de: Diff-Budget-Check (vor Commit oder in CI)
  file: scripts/diff_budget.py
  lang: python
  note:
    en: >-
      Adapted from the diff-budget post on dev.to (yureki_lab). Reads the real git diff, so it also catches edits made
      through the shell. Usage: python3 scripts/diff_budget.py origin/main 6 150
    zh: >-
      改编自 dev.to（yureki_lab）的 diff budget 文章。读取真实的 git diff，所以通过 shell 做的修改也逃不掉。用法：python3 scripts/diff_budget.py
      origin/main 6 150
    pt: >-
      Adaptado do post de diff-budget no dev.to (yureki_lab). Lê o git diff real, então também pega edits via shell.
      Uso: python3 scripts/diff_budget.py origin/main 6 150
    ko: >-
      dev.to(yureki_lab) diff-budget 글에서 옮김. 실제 git diff를 읽어 셸 편집도 잡습니다. 사용법: python3 scripts/diff_budget.py origin/main
      6 150
    vi: >-
      Chuyển từ bài diff-budget trên dev.to (yureki_lab). Đọc git diff thật nên cũng bắt edit qua shell. Cách dùng:
      python3 scripts/diff_budget.py origin/main 6 150
    de: >-
      Angepasst vom Diff-Budget-Post auf dev.to (yureki_lab). Liest den echten Git-Diff und fängt so auch Shell-Edits.
      Nutzung: python3 scripts/diff_budget.py origin/main 6 150
  code: |
    #!/usr/bin/env python3
    """Fail if the diff vs BASE touches files outside .agent-scope or exceeds the budget."""
    import fnmatch, os, subprocess, sys

    base = sys.argv[1] if len(sys.argv) > 1 else "HEAD"
    max_files = int(sys.argv[2]) if len(sys.argv) > 2 else 6
    max_lines = int(sys.argv[3]) if len(sys.argv) > 3 else 150

    allowed = []
    if os.path.exists(".agent-scope"):
        allowed = [l.strip() for l in open(".agent-scope") if l.strip() and not l.startswith("#")]

    out = subprocess.run(["git", "diff", "--numstat", base], capture_output=True, text=True, check=True).stdout
    untracked = subprocess.run(["git", "ls-files", "--others", "--exclude-standard"],
                               capture_output=True, text=True, check=True).stdout.split()

    files, lines, outside = 0, 0, []
    rows = [r.split("\t") for r in out.strip().splitlines()] + [["0", "0", p] for p in untracked]
    for added, deleted, path in rows:
        files += 1
        if added != "-":
            lines += int(added) + int(deleted)
        if allowed and not any(fnmatch.fnmatch(path, p) for p in allowed):
            outside.append(path)

    problems = []
    if outside:
        problems.append("out-of-scope files: " + ", ".join(outside))
    if files > max_files:
        problems.append(f"{files} files changed (budget {max_files})")
    if lines > max_lines:
        problems.append(f"{lines} lines changed (budget {max_lines})")

    if problems:
        print("OVER BUDGET: " + "; ".join(problems))
        sys.exit(1)
    print(f"within budget: {files} files, {lines} lines")
verify-skill:
  kind: skill
  title:
    en: Shared /verify skill for Claude Code
    zh: 团队共享的 /verify 技能（Claude Code）
    pt: 'Skill /verify: exigir evidência, não alegações'
    ko: '/verify 스킬: 주장 대신 증거 요구'
    vi: 'Skill /verify: đòi bằng chứng, không lời khẳng định'
    de: 'Skill /verify: Evidenz fordern, keine Behauptungen'
  file: .claude/skills/verify/SKILL.md
  lang: markdown
  note:
    en: >-
      Commit it to the repo so the whole team (and every agent session) runs the same checks. Replace the commands with
      your project's real ones.
    zh: 把它提交进仓库，让整个团队（以及每个智能体会话）跑同一套检查。把命令换成你项目里真实的命令。
  code: |
    ---
    name: verify
    description: Verify the current change before calling it done. Use before every commit, PR, or "done" message.
    ---

    # Verify

    Run every step and paste the real output. Never summarize a step you did not run.

    1. **Scope**: run `git diff --stat` and `git status --short`. For every changed file, say which part
       of the request needs it. Any file you cannot justify gets reverted, or listed under
       "Unrequested changes" for the user to decide.
    2. **Build and types**: `npm run build` (or the project's build command).
    3. **Tests**: `npm test`. Report pass/fail counts. If a test was edited, skipped or deleted,
       say so explicitly with the reason.
    4. **Behavior**: exercise the changed behavior once for real (a curl, a CLI run, a screenshot)
       and show what happened.
    5. **Report** in this format:
       - Requested: <one line>
       - Changed files: <list, each with its reason>
       - Checks run: <command -> result>
       - Not done / unsure: <list, or "none">
stop-hook-tests:
  kind: hook
  title:
    en: 'Claude Code Stop hook: don''t let the agent finish while tests fail'
    zh: Claude Code Stop 钩子：测试不过就不让智能体收工
    pt: 'Hook Stop: rodar testes antes de declarar done'
    ko: 'Stop 훅: done 선언 전 테스트 실행'
    vi: 'Hook Stop: chạy test trước khi tuyên bố done'
    de: 'Stop-Hook: Tests laufen vor „done“'
  file: .claude/settings.json
  lang: json
  note:
    en: >-
      A Stop hook that exits with code 2 keeps Claude working and shows it stderr. The stop_hook_active check stops it
      from looping forever. Swap `npm test` for your test command.
    zh: Stop 钩子以退出码 2 结束时，Claude 会继续工作并看到 stderr。检查 stop_hook_active 可避免无限循环。把 `npm test` 换成你的测试命令。
  code: |
    {
      "hooks": {
        "Stop": [
          {
            "hooks": [
              {
                "type": "command",
                "command": "python3 -c \"import json,sys,subprocess; d=json.load(sys.stdin); sys.exit(0) if d.get('stop_hook_active') else None; r=subprocess.run('npm test --silent', shell=True, capture_output=True, text=True); sys.stderr.write('Tests are failing. Fix them (without weakening them) before stopping:\\n'+r.stdout[-3000:]+r.stderr[-2000:]) if r.returncode else None; sys.exit(2 if r.returncode else 0)\""
              }
            ]
          }
        ]
      }
    }
protect-tests-hook:
  kind: hook
  title:
    en: 'Claude Code PreToolUse hook: tests are read-only unless you say so'
    zh: Claude Code PreToolUse 钩子：除非你明确允许，测试文件只读
    pt: 'Hook PreToolUse: proteger arquivos de teste de edits'
    ko: 'PreToolUse 훅: 테스트 파일 편집 보호'
    vi: 'Hook PreToolUse: bảo vệ file test khỏi edit'
    de: 'PreToolUse-Hook: Test-Dateien vor Edits schützen'
  file: .claude/hooks/protect_tests.py
  lang: python
  note:
    en: >-
      Register it like the scope guard (matcher Edit|Write|MultiEdit). Run `ALLOW_TEST_EDITS=1 claude` for sessions
      where changing tests is the task.
    zh: 像范围守卫一样注册（matcher 为 Edit|Write|MultiEdit）。如果这次任务本身就是改测试，用 `ALLOW_TEST_EDITS=1 claude` 启动。
  code: >
    #!/usr/bin/env python3

    """Block edits to test files and CI config unless ALLOW_TEST_EDITS=1."""

    import json, os, re, sys


    call = json.load(sys.stdin)

    if call.get("tool_name") not in ("Edit", "Write", "MultiEdit") or os.environ.get("ALLOW_TEST_EDITS") == "1":
        sys.exit(0)

    path = call["tool_input"].get("file_path", "")

    protected =
    re.compile(r"(^|/)(tests?|__tests__|spec)/|\.(test|spec)\.[jt]sx?$|_test\.(go|py)$|(^|/)test_[^/]+\.py$|\.github/workflows/")

    if protected.search(path):
        print(f"BLOCKED: {path} is a test/CI file. Make the code pass the existing test. "
              "If you believe the test itself is wrong, stop and explain why to the user.", file=sys.stderr)
        sys.exit(2)
    sys.exit(0)
destructive-bash-hook:
  kind: hook
  title:
    en: 'Claude Code PreToolUse hook: stop destructive shell commands'
    zh: Claude Code PreToolUse 钩子：拦截破坏性 shell 命令
    pt: 'Hook PreToolUse: bloquear bash destrutivo'
    ko: 'PreToolUse 훅: 파괴적 bash 차단'
    vi: 'Hook PreToolUse: chặn bash phá hủy'
    de: 'PreToolUse-Hook: destruktives Bash blocken'
  file: .claude/hooks/block_destructive.py
  lang: python
  note:
    en: >-
      Register with matcher "Bash". A pattern list is a seatbelt, not a sandbox; keep real backups and least-privilege
      credentials too.
    zh: 用 matcher "Bash" 注册。正则清单是安全带，不是沙箱；备份和最小权限凭据同样要有。
  code: |
    #!/usr/bin/env python3
    """Block high-blast-radius shell commands; the agent must ask the user instead."""
    import json, re, sys

    call = json.load(sys.stdin)
    if call.get("tool_name") != "Bash":
        sys.exit(0)
    cmd = call["tool_input"].get("command", "")

    dangerous = [
        r"\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r",   # rm -rf / rm -fr
        r"\bgit\s+push\b.*(--force\b|-f\b|--force-with-lease)",
        r"\bgit\s+reset\s+--hard\b",
        r"\bgit\s+clean\s+-[a-zA-Z]*f",
        r"\bgit\s+checkout\s+--\s+\.",
        r"\b(drop|truncate)\s+(table|database|schema)\b",
        r"\bdelete\s+from\s+\w+\s*;?\s*$",                              # DELETE without WHERE
        r"\b(terraform|tofu)\s+destroy\b",
        r"\bkubectl\s+delete\b",
    ]
    for pat in dangerous:
        if re.search(pat, cmd, re.IGNORECASE):
            print(f"BLOCKED destructive command: {cmd!r}\n"
                  "Explain what you want to run and why, and let the user run it or approve it.", file=sys.stderr)
            sys.exit(2)
    sys.exit(0)
deny-permissions:
  kind: settings
  title:
    en: 'Claude Code permissions: hard-deny sensitive paths, ask before installs'
    zh: Claude Code 权限：硬性禁止敏感路径，安装依赖前先询问
    pt: Negar ferramentas perigosas nas permissões do Claude Code
    ko: Claude Code 권한에서 위험한 도구 거부
    vi: Từ chối tool nguy hiểm trong quyền Claude Code
    de: Gefährliche Tools in Claude-Code-Permissions verweigern
  file: .claude/settings.json
  lang: json
  note:
    en: Rules in CLAUDE.md are context; permission rules are enforced by the tool. Adjust the paths to your repo.
    zh: CLAUDE.md 里的规则只是上下文；权限规则由工具强制执行。按你的仓库调整路径。
  code: |
    {
      "permissions": {
        "deny": [
          "Edit(./migrations/**)",
          "Edit(./.env*)",
          "Edit(./package-lock.json)",
          "Edit(./pnpm-lock.yaml)",
          "Edit(./src/generated/**)"
        ],
        "ask": [
          "Bash(npm install:*)",
          "Bash(pnpm add:*)",
          "Bash(yarn add:*)",
          "Bash(pip install:*)",
          "Bash(git push:*)"
        ]
      }
    }
review-skill:
  kind: skill
  title:
    en: Fresh-context review skill (subagent reviews the diff, not the chat)
    zh: 全新上下文的审查技能（子智能体只看 diff，不看聊天记录）
    pt: 'Skill /code-review: revisão com contexto limpo'
    ko: '/code-review 스킬: 깨끗한 컨텍스트 리뷰'
    vi: 'Skill /code-review: review với ngữ cảnh sạch'
    de: 'Skill /code-review: Review mit frischem Kontext'
  file: .claude/skills/review-diff/SKILL.md
  lang: markdown
  note:
    en: >-
      Follows the habit Anthropic describes in its code-review post: verify first, then have a subagent review the diff
      with fresh context. Named review-diff to avoid clashing with built-in or popular /code-review skills.
    zh: 沿用 Anthropic 代码审查文章里的做法：先验证，再让一个上下文干净的子智能体审 diff。命名为 review-diff，避免和内置或流行的 /code-review 技能重名。
  code: |
    ---
    name: review-diff
    description: Review the current diff with fresh context before a PR. Use after /verify passes.
    ---

    # Review the diff

    Start a subagent that has NOT seen this conversation. Give it only:
    - the original request (one paragraph, verbatim),
    - the output of `git diff origin/main...HEAD`,
    - the names of the test/build commands.

    Ask it to report, with file:line for each finding:
    1. **Wrong feature**: does the diff do what the request asked? Quote the request line each change serves.
    2. **Bugs**: logic errors, missing edge cases (empty, null, boundary), unhandled errors,
       unawaited promises, invented APIs or packages, swallowed exceptions.
    3. **Overreach**: changes no request line needs (refactors, renames, formatting, dependency or
       config edits, public API changes, weakened tests).
    4. **Evidence gaps**: claims in the PR description that no command output supports.

    Then fix real findings, or list them under "Known issues" in the PR. Do not argue with the reviewer
    in the PR text; either fix or explain in one line.
acceptance-spec:
  kind: spec
  title:
    en: SPEC.md acceptance checks (written and approved before code)
    zh: SPEC.md 验收标准（先写、先确认，再写代码）
    pt: Template de aceite que exclui a leitura errada
    ko: 잘못된 해석을 배제하는 수락 템플릿
    vi: Mẫu chấp nhận loại trừ cách đọc sai
    de: Abnahme-Vorlage, die die falsche Lesart ausschließt
  file: SPEC.md
  lang: markdown
  note:
    en: >-
      Teammates annotate this file (or the mockup/artifact) instead of reviewing a big PR. Each check should separate
      the reading you mean from the reading you don't.
    zh: 队友直接在这个文件（或设计稿/产物）上批注，而不是事后审一个大 PR。每条验收标准都要能区分“你要的理解”和“你不要的理解”。
  code: |
    # Spec: <feature name>

    ## Goal (one sentence, in the user's words)

    ## Out of scope
    - <things a reasonable agent might also do, but must not>

    ## Acceptance checks (each one runnable)
    - [ ] Given <input>, when <action>, then <exact observable result>
    - [ ] Example that rules out the wrong reading: <input> -> <expected>, NOT <plausible wrong output>
    - [ ] Command that proves it: `<test or curl command>`

    ## Open questions (agent must ask, not assume)
    - <question>

    ## Approved by: <name> on <date>
stdin-command-guard:
  kind: hook
  title:
    en: 'PreToolUse hook: read the shell command from stdin and exit 2'
    zh: PreToolUse 钩子：从 stdin 读 shell 命令，并用退出码 2 拦截
    pt: 'Hook PreToolUse: ler o comando de shell no stdin e sair 2'
    ko: 'PreToolUse 훅: stdin에서 셸 명령을 읽고 종료 코드 2'
    vi: 'Hook PreToolUse: đọc lệnh shell từ stdin và thoát 2'
    de: 'PreToolUse-Hook: Shell-Befehl von stdin lesen und mit Exit 2 blocken'
  file: .claude/hooks/stdin_command_guard.py
  lang: python
  note:
    en: >-
      Claude Code sends the tool call as JSON on stdin. A check of $1 matches nothing and exits 0. This script reads
      tool_input.command, treats Bash and Shell as the shell tools, and exits 2 on recursive rm, on a shell call with
      no command, or on stdin that is not JSON. Prove it before you trust it. printf '%s'
      '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/fake"}}' | python3 .claude/hooks/stdin_command_guard.py
      must print BLOCKED on stderr and exit 2. Exit 1 still fails open unless the settings set onFailure or failClosed.
    zh: >-
      Claude Code 把工具调用以 JSON 写到 stdin。检查 $1 什么都匹配不到，然后退出码 0。这个脚本读 tool_input.command，把 Bash 和 Shell
      都当成 shell 工具，在递归 rm、没有命令的 shell 调用，或 stdin 不是 JSON 时退出码 2。先证明它再信任它。printf '%s'
      '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/fake"}}' | python3 .claude/hooks/stdin_command_guard.py
      必须在 stderr 打出 BLOCKED，并且退出码是 2。退出码 1 仍然放行，除非配置里写了 onFailure 或 failClosed。
    pt: >-
      O Claude Code manda a tool call como JSON no stdin. Checar $1 não casa nada e sai 0. Este script lê
      tool_input.command, trata Bash e Shell como tools de shell, e sai 2 em rm recursivo, em call de shell sem
      comando, ou em stdin que não é JSON. Prove antes de confiar. printf '%s'
      '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/fake"}}' | python3 .claude/hooks/stdin_command_guard.py
      tem de imprimir BLOCKED no stderr e sair 2. Exit 1 ainda abre a mão, a menos que as settings tenham onFailure ou
      failClosed.
    ko: >-
      Claude Code는 도구 호출을 stdin의 JSON으로 보냅니다. $1 검사는 아무것도 맞지 않고 0으로 끝납니다. 이 스크립트는 tool_input.command를 읽고 Bash와
      Shell을 셸 도구로 보며, 재귀 rm, 명령 없는 셸 호출, JSON이 아닌 stdin에서 2로 끝납니다. 믿기 전에 증명하세요. printf '%s'
      '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/fake"}}' | python3 .claude/hooks/stdin_command_guard.py
      는 stderr에 BLOCKED를 찍고 2로 끝나야 합니다. 종료 1은 설정에 onFailure나 failClosed가 없으면 여전히 통과합니다.
    vi: >-
      Claude Code gửi tool call dạng JSON trên stdin. Kiểm $1 không khớp gì và thoát 0. Script này đọc
      tool_input.command, coi Bash và Shell là tool shell, và thoát 2 khi rm đệ quy, khi call shell không có lệnh, hoặc
      khi stdin không phải JSON. Chứng minh trước khi tin. printf '%s'
      '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/fake"}}' | python3 .claude/hooks/stdin_command_guard.py
      phải in BLOCKED ra stderr và thoát 2. Exit 1 vẫn cho qua nếu cấu hình không đặt onFailure hoặc failClosed.
    de: >-
      Claude Code schickt den Tool-Call als JSON auf stdin. Ein Check von $1 trifft nichts und endet mit 0. Dieses
      Script liest tool_input.command, behandelt Bash und Shell als Shell-Tools und endet mit 2 bei rekursivem rm, bei
      einem Shell-Call ohne Befehl oder bei stdin, das kein JSON ist. Erst beweisen, dann vertrauen. printf '%s'
      '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/fake"}}' | python3 .claude/hooks/stdin_command_guard.py
      muss BLOCKED auf stderr schreiben und mit 2 enden. Exit 1 lässt weiter durch, solange die Settings nicht
      onFailure oder failClosed setzen.
  code: |
    #!/usr/bin/env python3
    """PreToolUse: block recursive rm. The tool call is JSON on stdin. $1 is empty."""
    import json, re, sys

    RECURSIVE_RM = re.compile(
        r"(?:^|[\s;&|`(])rm\s+(-[a-zA-Z]*r[a-zA-Z]*|--recursive)\b"
    )

    raw = sys.stdin.read()
    try:
        call = json.loads(raw) if raw.strip() else {}
    except json.JSONDecodeError:
        print("BLOCKED: hook could not parse the tool call on stdin. Refusing to fail open.", file=sys.stderr)
        sys.exit(2)

    if not isinstance(call, dict):
        print("BLOCKED: tool call JSON was not an object.", file=sys.stderr)
        sys.exit(2)

    tool = call.get("tool_name") or ""
    tool_input = call.get("tool_input")
    if isinstance(tool_input, str):
        try:
            tool_input = json.loads(tool_input)
        except json.JSONDecodeError:
            tool_input = {}
    if not isinstance(tool_input, dict):
        tool_input = {}
    command = tool_input.get("command") or call.get("command") or ""
    if not isinstance(command, str):
        command = ""

    if tool and tool not in ("Bash", "Shell"):
        sys.exit(0)

    if not command.strip():
        print(
            "BLOCKED: no shell command in stdin JSON (tool_input.command). $1 is not the command.",
            file=sys.stderr,
        )
        sys.exit(2)

    if RECURSIVE_RM.search(command):
        print(f"BLOCKED: recursive rm is not allowed: {command}", file=sys.stderr)
        sys.exit(2)

    sys.exit(0)
stdin-command-guard-settings:
  kind: settings
  title:
    en: 'Claude Code: register the stdin guard and block on hook failure'
    zh: Claude Code：注册 stdin 守卫，钩子失败时拦截
    pt: 'Claude Code: registrar o guard de stdin e bloquear se o hook falhar'
    ko: 'Claude Code: stdin 가드를 등록하고 훅 실패 시 차단'
    vi: 'Claude Code: đăng ký guard stdin và chặn khi hook lỗi'
    de: 'Claude Code: stdin-Guard registrieren und bei Hook-Fehler blocken'
  file: .claude/settings.json
  lang: json
  note:
    en: >-
      Put `"onFailure": "block"` on the hook object, not on the matcher group. The hooks docs date that field to Claude
      Code v2.1.295 for command and HTTP hooks. Agent SDK callbacks got it in 2.1.317. Matcher `Bash` does not see
      `Write`, and it does not see Cursor's `Shell`. A path guard needs matcher `Edit|Write`, case-sensitive. Without
      onFailure, exit 1 and a crash let the call through. Only exit 2 blocks on its own.
    zh: >-
      把 `"onFailure": "block"` 写在钩子对象上，不要写在 matcher 那一层。钩子文档把这个字段记在 Claude Code v2.1.295 的 command 和 HTTP
      钩子上。Agent SDK 回调在 2.1.317 才有。matcher `Bash` 看不到 `Write`，也看不到 Cursor 的 `Shell`。路径守卫的 matcher 必须是
      `Edit|Write`，区分大小写。没有 onFailure 时，退出码 1 和崩溃都会放行。只有退出码 2 自己就能拦截。
    pt: >-
      Ponha `"onFailure": "block"` no objeto do hook, não no grupo do matcher. A doc de hooks data esse campo no Claude
      Code v2.1.295 para hooks command e HTTP. Callbacks do Agent SDK receberam isso no 2.1.317. Matcher `Bash` não vê
      `Write`, nem o `Shell` do Cursor. Um guard de path precisa do matcher `Edit|Write`, com maiúsculas. Sem
      onFailure, exit 1 e um crash deixam a call passar. Só o exit 2 bloqueia sozinho.
    ko: >-
      `"onFailure": "block"`은 matcher 그룹이 아니라 훅 객체에 두세요. 훅 문서는 이 필드를 command와 HTTP 훅에 대해 Claude Code
      v2.1.295로 적습니다. Agent SDK 콜백은 2.1.317에 받았습니다. matcher `Bash`는 `Write`를 보지 못하고 Cursor의 `Shell`도 보지
      못합니다. 경로 가드의 matcher는 대소문자를 가리는 `Edit|Write`여야 합니다. onFailure가 없으면 종료 1과 크래시가 호출을 통과시킵니다. 종료 2만 혼자서
      차단합니다.
    vi: >-
      Đặt `"onFailure": "block"` trên object hook, không trên nhóm matcher. Tài liệu hook ghi field này ở Claude Code
      v2.1.295 cho hook command và HTTP. Callback Agent SDK có nó ở 2.1.317. Matcher `Bash` không thấy `Write`, và
      không thấy `Shell` của Cursor. Guard path cần matcher `Edit|Write`, phân biệt hoa thường. Không có onFailure,
      exit 1 và crash cho call qua. Chỉ exit 2 tự chặn.
    de: >-
      `"onFailure": "block"` auf das Hook-Objekt setzen, nicht auf die Matcher-Gruppe. Die Hook-Doku datiert das Feld
      für Command- und HTTP-Hooks auf Claude Code v2.1.295. Agent-SDK-Callbacks bekamen es in 2.1.317. Matcher `Bash`
      sieht weder `Write` noch Cursors `Shell`. Ein Pfad-Guard braucht den Matcher `Edit|Write`, groß- und
      kleinschreibungsempfindlich. Ohne onFailure lassen Exit 1 und ein Crash den Call durch. Nur Exit 2 blockt von
      selbst.
  code: |
    {
      "hooks": {
        "PreToolUse": [
          {
            "matcher": "Bash",
            "hooks": [
              {
                "type": "command",
                "command": "python3 \"$CLAUDE_PROJECT_DIR\"/.claude/hooks/stdin_command_guard.py",
                "onFailure": "block"
              }
            ]
          }
        ]
      }
    }
cursor-fail-closed-hooks:
  kind: settings
  title:
    en: 'Cursor: failClosed on the stdin shell guard'
    zh: Cursor：给 stdin shell 守卫打开 failClosed
    pt: 'Cursor: failClosed no guard de shell por stdin'
    ko: 'Cursor: stdin 셸 가드에 failClosed'
    vi: 'Cursor: failClosed cho guard shell đọc stdin'
    de: 'Cursor: failClosed am stdin-Shell-Guard'
  file: .cursor/hooks.json
  lang: json
  note:
    en: >-
      failClosed defaults to false. A crash, a timeout, or any exit other than 2 then lets the call through. preToolUse
      names the shell tool Shell, so the matcher is Shell|Bash. Exit 2 blocks. Cursor 1.0.40 ignored a nested
      permissionDecision deny under hookSpecificOutput on PreToolUse. Re-test a deny after every update. The same
      script as the Claude hook reads tool_input.command from stdin.
    zh: >-
      failClosed 默认是 false。这时崩溃、超时，或除 2 以外的退出码都会放行。preToolUse 把 shell 工具叫做 Shell，所以 matcher 是
      Shell|Bash。退出码 2 才拦截。Cursor 1.0.40 忽略了 PreToolUse 上 hookSpecificOutput 里嵌套的 permissionDecision deny。每次更新后重新测
      deny。脚本和 Claude 那个钩子是同一个，从 stdin 读 tool_input.command。
    pt: >-
      failClosed vem false. Aí um crash, um timeout ou qualquer exit que não seja 2 deixa a call passar. preToolUse
      chama a tool de shell de Shell, então o matcher é Shell|Bash. Exit 2 bloqueia. O Cursor 1.0.40 ignorou um deny
      aninhado de permissionDecision sob hookSpecificOutput no PreToolUse. Teste o deny de novo depois de cada update.
      O script é o mesmo hook do Claude e lê tool_input.command no stdin.
    ko: >-
      failClosed 기본값은 false입니다. 그러면 크래시, 타임아웃, 2가 아닌 종료가 호출을 통과시킵니다. preToolUse는 셸 도구를 Shell로 부르므로 matcher는
      Shell|Bash입니다. 종료 코드 2가 차단합니다. Cursor 1.0.40은 PreToolUse에서 hookSpecificOutput 아래 중첩된 permissionDecision
      deny를 무시했습니다. 업데이트마다 deny를 다시 테스트하세요. 스크립트는 Claude 훅과 같고 stdin에서 tool_input.command를 읽습니다.
    vi: >-
      failClosed mặc định là false. Khi đó crash, timeout, hoặc mọi exit khác 2 cho call qua. preToolUse gọi tool shell
      là Shell, nên matcher là Shell|Bash. Exit 2 mới chặn. Cursor 1.0.40 bỏ qua deny permissionDecision lồng dưới
      hookSpecificOutput trên PreToolUse. Test lại deny sau mỗi bản cập nhật. Script là cùng hook Claude và đọc
      tool_input.command từ stdin.
    de: >-
      failClosed ist standardmäßig false. Dann lassen ein Crash, ein Timeout oder jedes Exit außer 2 den Call durch.
      preToolUse nennt das Shell-Tool Shell, also ist der Matcher Shell|Bash. Exit 2 blockt. Cursor 1.0.40 ignorierte
      ein verschachteltes permissionDecision deny unter hookSpecificOutput bei PreToolUse. Ein Deny nach jedem Update
      neu testen. Dasselbe Script wie der Claude-Hook liest tool_input.command von stdin.
  code: |
    {
      "version": 1,
      "hooks": {
        "preToolUse": [
          {
            "command": "python3 .claude/hooks/stdin_command_guard.py",
            "matcher": "Shell|Bash",
            "failClosed": true
          }
        ]
      }
    }
